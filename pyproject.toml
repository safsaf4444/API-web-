[project]
name = "seren-medical-evidence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9",
    "resend>=2.1.0",
]

[project.scripts]
app = "backend.app:app"