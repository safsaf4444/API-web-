[alembic]
# Path to migration scripts
script_location = alembic

# THE FIX: Forces the current directory into Python's path
# so it finds the 'backend' folder during migrations.
prepend_sys_path = .

# Use 'os' for path separator
path_separator = os

# Leave this blank. Your env.py handles the connection string.
sqlalchemy.url = 

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S