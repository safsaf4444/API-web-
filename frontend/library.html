<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Library — Seren</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .libLayout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .libLayout { grid-template-columns: 1fr; }
      .libSidebar { position: static !important; }
    }

    .libSidebar {
      position: sticky;
      top: 80px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .libSideCard {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .libSideTitle {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      color: var(--subtle);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .filterStack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .filterRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Status filter row */
    .statusFilterRow {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }

    .libActions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .libActions button {
      width: 100%;
      justify-content: flex-start;
      gap: 8px;
      padding: 10px 14px;
      font-size: 13px;
    }

    .folderList {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .folderRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: var(--r-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .14s ease;
      position: relative;
    }

    .folderRow:hover {
      background: var(--surface2);
      border-color: var(--line);
    }

    .folderRow.active {
      background: var(--navy);
      border-color: var(--navy);
    }

    .folderRow.active .folderRowName { color: var(--cream); }
    .folderRow.active .folderCount   { color: rgba(245,240,232,.5); }
    .folderRow.active .folderMenuBtn { color: rgba(245,240,232,.6); }

    .folderRowLeft {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .folderRowIcon {
      font-size: 13px;
      flex-shrink: 0;
      opacity: 0.55;
    }

    .folderRowName {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folderCount {
      font-size: 11px;
      color: var(--subtle);
      margin-left: auto;
      padding-right: 6px;
      flex-shrink: 0;
    }

    .folderMenuBtn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--subtle);
      font-size: 14px;
      flex-shrink: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      cursor: pointer;
      opacity: 0;
      transition: opacity .12s;
    }

    .folderRow:hover .folderMenuBtn { opacity: 1; }
    .folderRow.active .folderMenuBtn { opacity: 0.6; }

    .folderMenuBtn:hover {
      background: rgba(255,255,255,.12) !important;
      opacity: 1 !important;
      transform: none;
    }

    /* ── Main content ── */
    .libMain { display: flex; flex-direction: column; gap: 16px; }

    .libHeader {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .libTitle {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.03em;
      line-height: 1.0;
      margin: 0;
    }

    .libTitleAccent {
      color: var(--brass2);
      font-style: italic;
    }

    .libSubtitle {
      font-size: 13px;
      color: var(--subtle);
      margin-top: 6px;
      font-weight: 400;
    }

    .libCount {
      font-size: 12px;
      color: var(--subtle);
      font-weight: 500;
      padding-bottom: 4px;
    }

    /* Paper cards */
    .paperCard {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
      transition: border-color .15s, box-shadow .15s, transform .15s;
      cursor: default;
    }

    .paperCard:hover {
      border-color: rgba(201,168,124,.40);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    /* Coloured left accent stripe by reading status */
    .paperCard[data-status="reading"] { border-left: 3px solid var(--warn); }
    .paperCard[data-status="done"]    { border-left: 3px solid var(--good); }
    .paperCard[data-status="flagged"] { border-left: 3px solid var(--bad); }

    /* Phase 4: selected card highlight */
    .paperCard.selected {
      border-color: var(--navy) !important;
      box-shadow: 0 0 0 2px rgba(12,17,23,.12), var(--shadow-sm);
    }

    .paperCardInner {
      padding: 18px 20px 14px;
    }

    /* Phase 4: flex row so checkbox sits left of card content */
    .paperCardInnerRow {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .paperCardContent {
      flex: 1;
      min-width: 0;
    }

    .paperCardTitle {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.45;
      letter-spacing: -0.01em;
      margin-bottom: 9px;
    }

    .paperCardMeta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }

    .paperCardAbstract {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.65;
      margin: 0 0 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Footer */
    .paperCardFooter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 20px 12px;
      border-top: 1px solid var(--line2);
      background: var(--cream3);
    }

    .paperCardFooterLeft {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 0;
    }

    .paperCardFooterLeft select {
      width: auto;
      min-width: 130px;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: var(--r-xs);
      background: var(--surface);
    }

    .paperCardFooterRight {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .paperCardActions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Inline status chips */
    .cardStatusChips {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .statusChipMini {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: var(--r-pill);
      border: 1.5px solid;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all .13s ease;
      text-transform: uppercase;
      user-select: none;
    }

    .statusChipMini[data-status="unread"]  { border-color: var(--line);             background: transparent;             color: var(--subtle); }
    .statusChipMini[data-status="reading"] { border-color: rgba(196,134,42,.35);    background: rgba(196,134,42,.08);    color: var(--warn); }
    .statusChipMini[data-status="done"]    { border-color: rgba(61,122,74,.30);     background: rgba(61,122,74,.08);     color: var(--good); }
    .statusChipMini[data-status="flagged"] { border-color: rgba(184,64,64,.30);     background: rgba(184,64,64,.08);     color: var(--bad); }

    .statusChipMini.active[data-status="unread"]  { background: rgba(26,34,51,.07); }
    .statusChipMini.active[data-status="reading"] { background: rgba(196,134,42,.18); border-color: rgba(196,134,42,.5); }
    .statusChipMini.active[data-status="done"]    { background: rgba(61,122,74,.18);  border-color: rgba(61,122,74,.5); }
    .statusChipMini.active[data-status="flagged"] { background: rgba(184,64,64,.18);  border-color: rgba(184,64,64,.5); }

    .statusChipMini:hover { transform: translateY(-1px); box-shadow: var(--shadow-xs); }

    .inlineMsg {
      font-size: 11.5px;
      color: var(--subtle);
      margin-left: 4px;
    }

    .emptyLibrary {
      padding: 64px 20px;
      text-align: center;
      border: 1.5px dashed var(--parchment);
      border-radius: var(--r-lg);
      background: rgba(255,255,255,.5);
    }

    .emptyLibrary .emptyIcon {
      font-size: 40px;
      margin-bottom: 14px;
      opacity: 0.35;
    }

    .emptyLibrary p {
      color: var(--subtle);
      font-size: 14px;
      margin: 0 0 16px;
      line-height: 1.6;
    }

    .statusBar {
      font-size: 12.5px;
      color: var(--subtle);
      min-height: 18px;
    }

    .folderContextMenu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      min-width: 148px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow);
      padding: 5px;
      z-index: 3000;
    }

    .folderContextMenu button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 8px 10px;
      border-radius: var(--r-xs);
      font-size: 12.5px;
      color: var(--text2);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .folderContextMenu button:hover {
      background: var(--surface2);
      transform: none;
    }

    .folderContextMenu .danger { color: var(--bad); font-weight: 600; }

    /* ── Phase 4: Selection checkbox ── */
    .selectCheckbox {
      width: 20px;
      height: 20px;
      min-width: 20px;
      border-radius: 6px;
      cursor: pointer;
      accent-color: var(--navy);
      display: none;
      margin-top: 3px;
      flex-shrink: 0;
    }

    /* In select mode, show checkboxes and hide non-relevant controls */
    body.selectMode .selectCheckbox              { display: block; }
    body.selectMode .paperCardActions            { display: none; }
    body.selectMode .cardStatusChips             { display: none; }
    body.selectMode .paperCardFooterLeft select  { display: none; }
    body.selectMode .paperCard                   { cursor: pointer; }

    /* Select mode toggle button — active state */
    #selectModeBtn.active {
      background: var(--navy);
      color: var(--cream);
      border-color: var(--navy);
    }

    /* ── Phase 4: Floating synthesis action bar ── */
    #synthesisBar {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--navy);
      color: var(--cream);
      border-radius: var(--r-pill);
      padding: 12px 20px 12px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.08);
      z-index: 2000;
      transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
      pointer-events: none;
      opacity: 0;
      min-width: 340px;
      white-space: nowrap;
    }

    #synthesisBar.visible {
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
      opacity: 1;
    }

    .synthCount {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .synthCountBadge {
      background: var(--brass);
      color: var(--navy);
      border-radius: var(--r-pill);
      padding: 2px 10px;
      font-size: 13px;
      font-weight: 800;
      min-width: 28px;
      text-align: center;
      display: inline-block;
    }

    .synthActions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .btnSynth {
      background: var(--brass);
      color: var(--navy);
      border-color: var(--brass2);
      font-weight: 700;
      font-size: 12.5px;
      padding: 7px 16px;
    }

    .btnSynth:hover { background: var(--brass-light); transform: translateY(-1px); }

    .btnCancel {
      background: rgba(255,255,255,.08);
      color: rgba(245,240,232,.75);
      border-color: rgba(255,255,255,.12);
      font-size: 12.5px;
      padding: 7px 14px;
    }

    .btnCancel:hover { background: rgba(255,255,255,.14); transform: none; }
  </style>
</head>
<body>

<main>
  <div class="libLayout">

    <aside class="libSidebar">

      <div class="libSideCard">
        <div class="libSideTitle">Filters</div>

        <div class="filterStack">
          <div>
            <label>Search</label>
            <input id="q" placeholder="Filter by title or abstract…" autocomplete="off"/>
          </div>

          <div>
            <label>Sort by</label>
            <select id="sort">
              <option value="newest" selected>Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="year_desc">Year ↓</option>
              <option value="year_asc">Year ↑</option>
              <option value="title_asc">Title A → Z</option>
              <option value="title_desc">Title Z → A</option>
            </select>
          </div>

          <div>
            <label>Source</label>
            <select id="sourceFilter">
              <option value="all">All sources</option>
            </select>
          </div>

          <div>
            <label>Reading status</label>
            <div class="statusFilterRow">
              <span class="statusChip" data-status="unread"  data-filter="unread">○ Unread</span>
              <span class="statusChip" data-status="reading" data-filter="reading">◐ Reading</span>
              <span class="statusChip" data-status="done"    data-filter="done">● Done</span>
              <span class="statusChip" data-status="flagged" data-filter="flagged">⚑ Flag</span>
            </div>
          </div>

          <div class="filterRow">
            <div>
              <label>Year from</label>
              <input id="yearFrom" inputmode="numeric" placeholder="2015"/>
            </div>
            <div>
              <label>Year to</label>
              <input id="yearTo" inputmode="numeric" placeholder="2024"/>
            </div>
          </div>
        </div>

        <div class="libActions" style="margin-top:16px;">
          <button class="primary" id="loadBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Refresh
          </button>
          <button id="clearBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Clear filters
          </button>
        </div>

        <div id="statusMsg" class="statusBar" style="margin-top:10px;"></div>
      </div>

      <div class="libSideCard">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div class="libSideTitle" style="margin-bottom:0;">Folders</div>
          <button class="btn sm ghost" id="newFolderBtn" style="padding:5px 8px;" title="New folder">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New
          </button>
        </div>
        <div class="folderList" id="folderList"></div>
      </div>

    </aside>

    <div class="libMain">

      <div class="libHeader">
        <div>
          <div class="libTitle">Your <span class="libTitleAccent">Library</span></div>
          <div class="libSubtitle" id="libSubtitle">All saved papers</div>
        </div>
        <!-- Phase 4: header right — count + select/synthesise buttons -->
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="libCount" id="countLabel"></div>
          <button class="btn sm" id="selectModeBtn" title="Select papers to synthesise together">
            &#9638; Select
          </button>
          <a class="btn sm primary" href="synthesis.html" title="Open synthesis workspace">
            &#10227; Synthesise
          </a>
        </div>
      </div>

      <div id="paperList"></div>

    </div>
  </div>
</main>

<!-- Phase 4: Floating synthesis action bar -->
<div id="synthesisBar">
  <div class="synthCount">
    <span class="synthCountBadge" id="synthSelectedCount">0</span>
    papers selected
  </div>
  <div class="synthActions">
    <button class="btn sm btnCancel" id="cancelSelectBtn">Cancel</button>
    <button class="btn sm btnSynth"  id="synthSelectedBtn">&#10227; Synthesise these papers</button>
  </div>
</div>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
requireAuthOrRedirect();

const STATE_KEY = 'seren_library_v4';

let foldersCache   = [];
let activeFolderId = 'all';
let activeStatus   = null;
let activeTagFilter = null;
let openMenuId     = null;

// Phase 4: selection state
let selectedStudyIds = new Set();
let selectModeActive = false;

const STATUS_ICONS  = { unread: '○', reading: '◐', done: '●', flagged: '⚑' };
const STATUS_LABELS = { unread: 'Unread', reading: 'Reading', done: 'Done', flagged: 'Flagged' };

/* ── Utilities ── */
function $id(id) { return document.getElementById(id); }
function esc(s)  { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function normStr(x) { return (x ?? '').toString().trim(); }

function stripHtml(s) {
  return (s || "")
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/&[a-z]+;/gi, " ")
    .replace(/&#\d+;/gi, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function parseYear(x) {
  const n = parseInt(String(x || '').trim(), 10);
  return Number.isFinite(n) && n >= 1000 && n <= 3000 ? n : null;
}

function setStatus(html) {
  const el = $id('statusMsg');
  if (el) el.innerHTML = html || '';
}

function setCountLabel(text) {
  const el = $id('countLabel');
  if (el) el.textContent = text || '';
}

/* ── Phase 4: Select mode ── */
function enterSelectMode() {
  selectModeActive = true;
  selectedStudyIds.clear();
  document.body.classList.add('selectMode');
  const btn = $id('selectModeBtn');
  if (btn) btn.classList.add('active');
  updateSynthesisBar();
}

function exitSelectMode() {
  selectModeActive = false;
  selectedStudyIds.clear();
  document.body.classList.remove('selectMode');
  const btn = $id('selectModeBtn');
  if (btn) btn.classList.remove('active');
  document.querySelectorAll('.selectCheckbox').forEach(cb => { cb.checked = false; });
  document.querySelectorAll('.paperCard.selected').forEach(c => c.classList.remove('selected'));
  updateSynthesisBar();
}

function updateSynthesisBar() {
  const bar     = $id('synthesisBar');
  const countEl = $id('synthSelectedCount');
  if (!bar || !countEl) return;
  countEl.textContent = selectedStudyIds.size;
  if (selectModeActive && selectedStudyIds.size >= 2) {
    bar.classList.add('visible');
  } else {
    bar.classList.remove('visible');
  }
}

function toggleStudySelection(studyId, checked) {
  if (checked) {
    if (selectedStudyIds.size >= 10) {
      showToast('Limit reached', 'Maximum 10 papers per synthesis.', 'info');
      return false;
    }
    selectedStudyIds.add(studyId);
  } else {
    selectedStudyIds.delete(studyId);
  }
  updateSynthesisBar();
  return true;
}

$id('selectModeBtn').onclick = () => {
  if (selectModeActive) exitSelectMode();
  else enterSelectMode();
};

$id('cancelSelectBtn').onclick = exitSelectMode;

$id('synthSelectedBtn').onclick = () => {
  if (selectedStudyIds.size < 2) {
    showToast('Select papers', 'Select at least 2 papers to synthesise.', 'info');
    return;
  }
  sessionStorage.setItem('synthesis_study_ids', JSON.stringify([...selectedStudyIds]));
  location.href = 'synthesis.html';
};

/* ── State persistence ── */
function saveState() {
  try {
    sessionStorage.setItem(STATE_KEY, JSON.stringify({
      q:        $id('q').value || '',
      sort:     $id('sort').value || 'newest',
      folder:   activeFolderId,
      source:   $id('sourceFilter').value || 'all',
      yearFrom: $id('yearFrom').value || '',
      yearTo:   $id('yearTo').value || '',
      status:   activeStatus || '',
    }));
  } catch {}
}

function loadState() {
  try {
    const raw = sessionStorage.getItem(STATE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

/* ── Close any open folder menu ── */
function closeOpenMenu() {
  if (openMenuId !== null) {
    const existing = document.querySelector('.folderContextMenu');
    if (existing) existing.remove();
    openMenuId = null;
  }
}

document.addEventListener('click', closeOpenMenu);

/* ── Wire sidebar status filter chips ── */
function wireStatusFilterChips() {
  document.querySelectorAll('.statusChip[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.filter;
      if (activeStatus === val) {
        activeStatus = null;
        chip.classList.remove('active');
      } else {
        activeStatus = val;
        document.querySelectorAll('.statusChip[data-filter]').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
      }
      loadStudies();
      saveState();
    });
  });
}

/* ── Folder actions ── */
async function renameFolder(folder) {
  const name = await promptModal({
    title: 'Rename folder',
    message: 'Enter a new name',
    placeholder: 'e.g. Cardiology',
    okText: 'Rename',
    cancelText: 'Cancel',
    initialValue: folder.name || '',
  });
  if (!name) return;
  await fetchJson(`/folders/${folder.id}`, { method: 'PATCH', body: { name } });
  await loadFolders();
}

async function deleteFolder(folder) {
  const ok = await confirmModal({
    title: 'Delete folder?',
    message: 'Papers stay saved — they just move to "No folder".',
    okText: 'Delete',
    cancelText: 'Cancel',
    danger: true,
  });
  if (!ok) return;
  await fetchJson(`/folders/${folder.id}`, { method: 'DELETE' });
  activeFolderId = 'all';
  await loadFolders();
  await loadStudies();
}

async function newFolder() {
  const name = await promptModal({
    title: 'New folder',
    message: 'Enter a folder name',
    placeholder: 'e.g. Endocrinology',
    okText: 'Create',
    cancelText: 'Cancel',
    initialValue: '',
  });
  if (!name) return;
  await fetchJson('/folders', { method: 'POST', body: { name } });
  await loadFolders();
}

/* ── Render folder list ── */
function renderFolderList() {
  const list = $id('folderList');
  if (!list) return;

  const pseudoFolders = [
    { id: 'all',  name: 'All papers', icon: '◈' },
    { id: 'none', name: 'No folder',  icon: '◇' },
  ];

  const allFolders = [
    ...pseudoFolders,
    ...foldersCache.map(f => ({ ...f, icon: '◆', real: true })),
  ];

  list.innerHTML = allFolders.map(f => `
    <div class="folderRow${String(f.id) === String(activeFolderId) ? ' active' : ''}"
         data-folder-id="${esc(String(f.id))}"
         data-folder-real="${f.real ? '1' : '0'}">
      <div class="folderRowLeft">
        <span class="folderRowIcon">${f.icon}</span>
        <span class="folderRowName">${esc(f.name)}</span>
      </div>
      ${f.real
        ? `<button class="folderMenuBtn" data-menu-folder-id="${f.id}" title="Options">···</button>`
        : ''
      }
    </div>
  `).join('');

  /* Click to select folder */
  list.querySelectorAll('.folderRow').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.folderMenuBtn')) return;
      activeFolderId = row.dataset.folderId;
      renderFolderList();
      loadStudies();
      saveState();
    });
  });

  /* Folder menu button */
  list.querySelectorAll('.folderMenuBtn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      closeOpenMenu();

      const fid = parseInt(btn.dataset.menuFolderId, 10);
      const folder = foldersCache.find(f => f.id === fid);
      if (!folder) return;

      openMenuId = fid;

      const menu = document.createElement('div');
      menu.className = 'folderContextMenu';
      menu.innerHTML = `
        <button data-action="rename">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Rename
        </button>
        <button data-action="delete" class="danger">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Delete
        </button>
      `;

      menu.querySelector('[data-action="rename"]').onclick = async e2 => {
        e2.stopPropagation();
        closeOpenMenu();
        await renameFolder(folder);
      };

      menu.querySelector('[data-action="delete"]').onclick = async e2 => {
        e2.stopPropagation();
        closeOpenMenu();
        await deleteFolder(folder);
      };

      const row = btn.closest('.folderRow');
      row.style.position = 'relative';
      row.appendChild(menu);
    });
  });
}

/* ── Load folders ── */
async function loadFolders() {
  try {
    const folders = await fetchJson('/folders');
    foldersCache = Array.isArray(folders) ? folders : [];

    renderFolderList();

    /* Rebuild folder <select> in paper cards if visible */
    document.querySelectorAll('[data-folder-pick]').forEach(sel => {
      const studyId = sel.dataset.folderPick;
      const curVal  = sel.value;
      let opts = '<option value="">No folder</option>';
      for (const f of foldersCache) {
        opts += `<option value="${f.id}"${String(f.id) === curVal ? ' selected' : ''}>${esc(f.name)}</option>`;
      }
      sel.innerHTML = opts;
      sel.value = curVal;
    });

  } catch (e) {
    setStatus(`<span style="color:var(--bad);">${esc(e.message)}</span>`);
  }
}

/* ── Build source dropdown from loaded items ── */
function buildSourceFilter(items) {
  const sel  = $id('sourceFilter');
  if (!sel) return;
  const cur  = sel.value || 'all';
  const srcs = [...new Set((items || []).map(it => normStr(it?.source)).filter(Boolean))].sort();

  sel.innerHTML = '<option value="all">All sources</option>';
  srcs.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  sel.value = Array.from(sel.options).some(o => o.value === cur) ? cur : 'all';
}

/* ── Client-side filtering ── */
function applyFilters(items) {
  const src   = $id('sourceFilter').value || 'all';
  const yFrom = parseYear($id('yearFrom').value);
  const yTo   = parseYear($id('yearTo').value);

  return (items || []).filter(it => {
    if (src !== 'all' && normStr(it?.source) !== src) return false;
    const y = parseYear(it?.year);
    if (yFrom !== null && (y === null || y < yFrom)) return false;
    if (yTo   !== null && (y === null || y > yTo))   return false;
    if (activeTagFilter) {
      const tags = (it?.tags || '').split(',').map(t => t.trim().toLowerCase());
      if (!tags.includes(activeTagFilter.toLowerCase())) return false;
    }
    return true;
  });
}

/* ── Folder select HTML inside a paper card ── */
function folderSelectHtml(study) {
  let opts = '<option value="">No folder</option>';
  for (const f of foldersCache) {
    opts += `<option value="${f.id}"${String(f.id) === String(study.folder_id || '') ? ' selected' : ''}>${esc(f.name)}</option>`;
  }
  return `<select data-folder-pick="${study.id}" style="min-width:130px;">${opts}</select>`;
}

/* ── Status chips HTML for card footer ── */
function cardStatusChipsHtml(study) {
  const cur = study.reading_status || 'unread';
  return ['unread','reading','done','flagged'].map(s =>
    `<span class="statusChipMini${cur === s ? ' active' : ''}" data-status="${s}" data-card-status="${study.id}" data-val="${s}">${STATUS_ICONS[s]} ${STATUS_LABELS[s]}</span>`
  ).join('');
}

/* ── Render paper list ── */
function renderPapers(filtered, total) {
  const list = $id('paperList');
  if (!list) return;

  setCountLabel(filtered.length === total
    ? `${total} paper${total !== 1 ? 's' : ''}`
    : `${filtered.length} of ${total} papers`
  );

  /* Update subtitle */
  const subtitle = $id('libSubtitle');
  if (subtitle) {
    if (activeFolderId === 'all') {
      subtitle.textContent = activeStatus
        ? `Filtered: ${STATUS_LABELS[activeStatus] || activeStatus}`
        : 'All saved papers';
    } else if (activeFolderId === 'none') {
      subtitle.textContent = 'Papers without a folder';
    } else {
      const f = foldersCache.find(f => String(f.id) === String(activeFolderId));
      subtitle.textContent = f ? `Folder: ${f.name}` : 'Filtered view';
    }
  }

  if (!filtered.length) {
    list.innerHTML = `
      <div class="emptyLibrary">
        <div class="emptyIcon">◈</div>
        <p>No papers here yet.</p>
        <a class="btn" href="search.html">Search literature</a>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(it => {
    const isSelected = selectedStudyIds.has(it.id);
    return `
    <div class="paperCard${isSelected ? ' selected' : ''}" data-paper-id="${it.id}" data-status="${esc(it.reading_status || 'unread')}">

      <div class="paperCardInner">
        <!-- Phase 4: flex row wraps checkbox + all existing card content -->
        <div class="paperCardInnerRow">
          <input type="checkbox" class="selectCheckbox" data-select-id="${it.id}" ${isSelected ? 'checked' : ''}/>
          <div class="paperCardContent">
            <div class="paperCardTitle">${esc(it.title || 'Untitled')}</div>

            <div class="paperCardMeta">
              ${it.year       ? `<span class="badge blue">${esc(String(it.year))}</span>` : ''}
              ${it.study_type ? `<span class="badge green">${esc(it.study_type)}</span>` : ''}
              ${it.source     ? `<span class="badge coffee">${esc(it.source)}</span>` : ''}
              ${it.venue      ? `<span class="badge" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(it.venue)}</span>` : ''}
              ${it.tags       ? it.tags.split(',').slice(0,3).map(t => `<span class="badge brass" style="cursor:pointer;" title="Filter by tag: ${esc(t.trim())}" data-tag-filter="${esc(t.trim())}">${esc(t.trim())}</span>`).join('') : ''}
              ${it.comment_count ? `<span class="badge">&#x1F4AC; ${it.comment_count}</span>` : ''}
            </div>

            ${it.abstract ? `<p class="paperCardAbstract">${esc(stripHtml(it.abstract))}</p>` : ''}
            ${it.notes ? `<p class="paperCardAbstract" style="font-style:italic;color:var(--brass2);margin-top:4px;">&#x1F4DD; ${esc(stripHtml(it.notes).slice(0,120))}${stripHtml(it.notes).length > 120 ? '&hellip;' : ''}</p>` : ''}
          </div>
        </div>
      </div>

      <div class="paperCardFooter">
        <div class="paperCardFooterLeft">
          ${folderSelectHtml(it)}
          <span class="inlineMsg" id="fmsg-${it.id}"></span>
        </div>
        <div class="paperCardFooterRight">
          <div class="cardStatusChips" id="schips-${it.id}">${cardStatusChipsHtml(it)}</div>
          <div class="paperCardActions">
            <button class="btn primary sm" data-open data-study-id="${it.id}">Open</button>
            <button class="btn danger sm"  data-del  data-study-id="${it.id}">Delete</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  /* Wire tag filter clicks */
  list.querySelectorAll('[data-tag-filter]').forEach(tag => {
    tag.addEventListener('click', e => {
      e.stopPropagation();
      const t = tag.dataset.tagFilter;
      activeTagFilter = (activeTagFilter === t) ? null : t;
      const subtitle = $id('libSubtitle');
      if (activeTagFilter) {
        if (subtitle) subtitle.textContent = `Tag: ${activeTagFilter}`;
        showToast('Tag filter', `Showing papers tagged "${activeTagFilter}". Click the tag again or Clear filters to remove.`, 'info');
      }
      loadStudies();
    });
  });

  /* Wire folder selects */
  list.querySelectorAll('[data-folder-pick]').forEach(sel => {
    sel.onchange = async () => {
      const studyId = parseInt(sel.dataset.folderPick, 10);
      const msgEl   = $id(`fmsg-${studyId}`);
      if (msgEl) msgEl.textContent = 'Saving…';
      try {
        await fetchJson(`/studies/${studyId}`, {
          method: 'PATCH',
          body: { folder_id: sel.value ? parseInt(sel.value, 10) : null },
        });
        if (msgEl) {
          msgEl.innerHTML = '<span class="badge green">✓ Saved</span>';
          setTimeout(() => { msgEl.textContent = ''; }, 1800);
        }
        await loadStudies();
      } catch (e) {
        if (msgEl) msgEl.innerHTML = `<span style="color:var(--bad);">${esc(e.message)}</span>`;
      }
    };
  });

  /* Wire card status chips */
  list.querySelectorAll('[data-card-status]').forEach(chip => {
    chip.addEventListener('click', async e => {
      e.stopPropagation();
      const studyId = parseInt(chip.dataset.cardStatus, 10);
      const val     = chip.dataset.val;
      try {
        await fetchJson(`/studies/${studyId}`, {
          method: 'PATCH',
          body: { reading_status: val },
        });
        /* Update left stripe colour */
        const card = list.querySelector(`[data-paper-id="${studyId}"]`);
        if (card) card.dataset.status = val;
        /* Update chip active state */
        const chipsEl = $id(`schips-${studyId}`);
        if (chipsEl) {
          chipsEl.querySelectorAll('[data-card-status]').forEach(c => {
            c.classList.toggle('active', c.dataset.val === val);
          });
        }
        showToast('Status updated', `Marked as ${STATUS_LABELS[val]}`, 'success');
      } catch (err) {
        showToast('Error', err.message, 'error');
      }
    });
  });

  /* Phase 4: Wire selection checkboxes */
  list.querySelectorAll('.selectCheckbox').forEach(cb => {
    cb.addEventListener('change', e => {
      e.stopPropagation();
      const studyId = parseInt(cb.dataset.selectId, 10);
      const ok = toggleStudySelection(studyId, cb.checked);
      if (!ok) { cb.checked = false; return; }
      const card = list.querySelector(`[data-paper-id="${studyId}"]`);
      if (card) card.classList.toggle('selected', cb.checked);
    });
  });
}

/* ── Load studies ── */
async function loadStudies() {
  setStatus('');
  const q    = $id('q').value.trim();
  const sort = $id('sort').value;

  let url = `/studies?sort=${encodeURIComponent(sort)}`;
  if (q) url += `&q=${encodeURIComponent(q)}`;
  if (activeFolderId && activeFolderId !== 'all' && activeFolderId !== 'none') {
    url += `&folder_id=${encodeURIComponent(activeFolderId)}`;
  }
  if (activeStatus) {
    url += `&reading_status=${encodeURIComponent(activeStatus)}`;
  }

  try {
    let items = await fetchJson(url);
    if (!Array.isArray(items)) items = [];
    if (activeFolderId === 'none') items = items.filter(it => !it.folder_id);

    buildSourceFilter(items);
    const filtered = applyFilters(items);
    renderPapers(filtered, items.length);
    saveState();
  } catch (e) {
    setStatus(`<span style="color:var(--bad);">${esc(e.message)}</span>`);
  }
}

/* ── Delegated click handler (open / delete / Phase 4 select) ── */
$id('paperList').addEventListener('click', async e => {

  /* Phase 4: in select mode, clicking card body toggles selection */
  if (selectModeActive) {
    const card  = e.target.closest('.paperCard');
    const isCb  = e.target.closest('.selectCheckbox');
    const isBtn = e.target.closest('button');
    if (card && !isCb && !isBtn) {
      const studyId = parseInt(card.dataset.paperId, 10);
      const cb = card.querySelector('.selectCheckbox');
      if (cb) {
        cb.checked = !cb.checked;
        const ok = toggleStudySelection(studyId, cb.checked);
        if (!ok) { cb.checked = false; return; }
        card.classList.toggle('selected', cb.checked);
      }
    }
    return;
  }

  const btnOpen = e.target.closest('[data-open]');
  const btnDel  = e.target.closest('[data-del]');

  if (btnOpen) {
    sessionStorage.setItem('open_study_id', btnOpen.dataset.studyId);
    sessionStorage.removeItem('last_external');
    location.href = 'paper.html';
  }

  if (btnDel) {
    const id = parseInt(btnDel.dataset.studyId, 10);
    const ok = await confirmModal({
      title: 'Delete paper?',
      message: 'This removes it from your library permanently.',
      okText: 'Delete',
      cancelText: 'Cancel',
      danger: true,
    });
    if (!ok) return;
    try {
      await fetchJson(`/studies/${id}`, { method: 'DELETE' });
      showToast('Deleted', 'Paper removed from your library.', 'info');
      await loadStudies();
    } catch (err) {
      showToast('Error', err.message, 'error');
    }
  }
});

/* ── Debounce ── */
function debounce(fn, ms = 250) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
const debLoad = debounce(loadStudies, 280);

/* ── Event wiring ── */
$id('loadBtn').onclick      = loadStudies;
$id('newFolderBtn').onclick = async () => { await newFolder(); };

$id('clearBtn').onclick = async () => {
  $id('q').value            = '';
  $id('sort').value         = 'newest';
  $id('sourceFilter').value = 'all';
  $id('yearFrom').value     = '';
  $id('yearTo').value       = '';
  activeFolderId  = 'all';
  activeStatus    = null;
  activeTagFilter = null;
  document.querySelectorAll('.statusChip[data-filter]').forEach(c => c.classList.remove('active'));
  renderFolderList();
  saveState();
  await loadStudies();
};

$id('q').addEventListener('input',            () => { debLoad(); saveState(); });
$id('sort').addEventListener('change',        () => { loadStudies(); saveState(); });
$id('sourceFilter').addEventListener('change',() => { loadStudies(); saveState(); });
$id('yearFrom').addEventListener('input',     () => { debLoad(); saveState(); });
$id('yearTo').addEventListener('input',       () => { debLoad(); saveState(); });

/* ── Init ── */
(async function init() {
  wireStatusFilterChips();
  await loadFolders();

  const st = loadState();
  if (st) {
    $id('q').value        = st.q        || '';
    $id('sort').value     = st.sort     || 'newest';
    activeFolderId        = st.folder   || 'all';
    $id('yearFrom').value = st.yearFrom || '';
    $id('yearTo').value   = st.yearTo   || '';

    if (st.status) {
      activeStatus = st.status;
      const chip = document.querySelector(`.statusChip[data-filter="${st.status}"]`);
      if (chip) chip.classList.add('active');
    }

    renderFolderList();
  }

  await loadStudies();

  /* Restore source after items load */
  if (st?.source) {
    const sel = $id('sourceFilter');
    if (sel && Array.from(sel.options).some(o => o.value === st.source)) {
      sel.value = st.source;
      await loadStudies();
    }
  }
})();
</script>
