<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Search — Seren</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .searchLayout {
      display: grid;
      grid-template-columns: 280px minmax(0,1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 860px) { .searchLayout { grid-template-columns: 1fr; } }

    .searchSidebar {
      position: sticky;
      top: 80px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sideCard {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .sideLabel {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--subtle);
      margin-bottom: 14px;
    }

    .filterStack { display: flex; flex-direction: column; gap: 10px; }
    .filterRow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .checkGroup { display: flex; flex-direction: column; gap: 7px; }
    .checkRow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      cursor: pointer;
    }
    .checkRow input[type="checkbox"] {
      width: 15px; height: 15px;
      min-width: 15px; padding: 0;
      border-radius: 4px;
      cursor: pointer;
      accent-color: var(--navy);
    }

    .sideActions { display: flex; flex-direction: column; gap: 8px; }
    .sideActions button { width: 100%; justify-content: flex-start; font-size: 13px; }

    /* Results area */
    .resultsHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .resultsTitle {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      color: var(--navy);
    }

    .pagingRow {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pageInfo {
      font-size: 12px;
      color: var(--subtle);
      font-weight: 500;
      white-space: nowrap;
    }

    /* Result cards */
    .resultCard {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 18px 20px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-xs);
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .resultCard:hover {
      border-color: rgba(201,168,124,.35);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .resultTitle {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.4;
      margin-bottom: 5px;
    }

    .resultAuthors {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .resultAbstract {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-top: 8px;
      display: none;
    }
    .resultAbstract.open { display: block; }

    .resultFooter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line2);
      flex-wrap: wrap;
    }

    .filterChips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .statusMsg {
      font-size: 12.5px;
      color: var(--subtle);
      min-height: 18px;
      margin-bottom: 8px;
    }
    .statusMsg.error { color: var(--bad); font-weight: 600; }

    .emptyResults {
      padding: 56px 20px;
      text-align: center;
      border: 1.5px dashed var(--parchment);
      border-radius: var(--r-lg);
    }
    .emptyResults p { color: var(--subtle); font-size: 14px; margin: 0; }
  </style>
</head>
<body>
<main>
  <div class="searchLayout">

    <aside class="searchSidebar">

      <div class="sideCard">
        <div class="sideLabel">Search</div>
        <div class="filterStack">
          <div>
            <label>Query</label>
            <input id="q" placeholder="e.g. creatine supplementation" autocomplete="off"/>
          </div>
          <div>
            <label>Source</label>
            <select id="source">
              <option value="europepmc">Europe PMC</option>
              <option value="semantic_scholar">Semantic Scholar</option>
              <option value="openalex">OpenAlex</option>
              <option value="crossref">Crossref</option>
              <option value="pubmed">PubMed (NCBI)</option>
              <option value="core">CORE</option>
              <option value="clinicaltrials">ClinicalTrials.gov</option>
              <option value="preprints">Preprints (bioRxiv/medRxiv)</option>
            </select>
          </div>
          <div>
            <label>Results per page</label>
            <select id="limit">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
            </select>
          </div>
        </div>

        <div class="sideActions" style="margin-top:16px;">
          <button class="primary" id="searchBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            Search
          </button>
          <button id="clearBtn" class="ghost">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Clear filters
          </button>
        </div>
      </div>

      <div class="sideCard">
        <div class="sideLabel">Filters</div>
        <div class="filterStack">
          <div class="filterRow">
            <div>
              <label>Year from</label>
              <input id="yearFrom" inputmode="numeric" placeholder="2015"/>
            </div>
            <div>
              <label>Year to</label>
              <input id="yearTo" inputmode="numeric" placeholder="2024"/>
            </div>
          </div>

          <div>
            <label>Study type <span title="Study type classification is inferred from title/abstract text and may be inaccurate, especially for Crossref and OpenAlex sources." style="cursor:help;color:var(--subtle);font-size:11px;border-bottom:1px dashed var(--subtle);">accuracy varies ⓘ</span></label>
            <select id="studyType">
              <option value="">Any type</option>
              <option value="rct">RCT</option>
              <option value="meta_analysis">Meta-analysis</option>
              <option value="systematic_review">Systematic Review</option>
              <option value="observational">Observational</option>
              <option value="cohort">Cohort</option>
              <option value="case_control">Case-Control</option>
              <option value="case_report">Case Report</option>
              <option value="review">Review</option>
              <option value="editorial">Editorial</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div>
            <label>Language</label>
            <select id="language">
              <option value="">Any Language</option>
              <option value="eng">English</option>
              <option value="fre">French</option>
              <option value="spa">Spanish</option>
              <option value="ger">German</option>
            </select>
          </div>

          <div>
            <label>Author contains</label>
            <input id="author" placeholder="e.g. smith"/>
          </div>

          <div>
            <div class="sideLabel" style="margin-bottom:8px;">Options</div>
            <div class="checkGroup">
              <label class="checkRow"><input type="checkbox" id="hasAbstract"/> Has abstract</label>
              <label class="checkRow"><input type="checkbox" id="openAccess"/> Open access only</label>
              <label class="checkRow"><input type="checkbox" id="titleOnly"/> Title match only</label>
            </div>
          </div>
        </div>
      </div>

    </aside>

    <div>
      <div class="resultsHeader">
        <div class="resultsTitle">Results</div>
        <div class="pagingRow">
          <button class="btn sm ghost" id="bulkSaveBtn" style="display:none;">💾 Save all to Library</button>
          <button class="btn sm ghost" id="prevBtn" disabled>← Prev</button>
          <span class="pageInfo" id="pageLabel"></span>
          <button class="btn sm ghost" id="nextBtn" disabled>Next →</button>
        </div>
      </div>

      <div class="filterChips" id="activeFilters" style="margin-bottom:10px;"></div>
      <div class="statusMsg" id="msg"></div>

      <div id="results">
        <div class="emptyResults">
          <p>Enter a query and hit Search to find papers.</p>
        </div>
      </div>
    </div>

  </div>
</main>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
let stack = [];
let nextCursor = null;
let __LAST_ITEMS__ = [];
let __LAST_HIT_COUNT__ = null;
let __REQ_SEQ__ = 0;

const SOURCE_LABELS = {
  europepmc:'Europe PMC',
  semantic_scholar:'Semantic Scholar',
  openalex:'OpenAlex',
  crossref:'Crossref',
  pubmed:'PubMed (NCBI)',
  core:'CORE',
  clinicaltrials:'ClinicalTrials.gov',
  preprints:'Preprints (bioRxiv/medRxiv)',
};
const STUDY_TYPE_LABELS = { rct:'RCT', meta_analysis:'Meta-analysis', systematic_review:'Systematic Review', observational:'Observational', cohort:'Cohort', case_control:'Case-Control', case_report:'Case Report', review:'Review', editorial:'Editorial', other:'Other' };
const LANGUAGE_LABELS = { eng:'English', fre:'French', spa:'Spanish', ger:'German' };

function $id(id) { return document.getElementById(id); }
function esc(s) { return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

// Added stripHtml for safe abstract rendering
function stripHtml(s) {
  return (s || "")
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/&[a-z]+;/gi, " ")
    .replace(/&#\d+;/gi, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function setMsg(html, isErr) {
  const el = $id('msg');
  el.innerHTML = html || '';
  el.className = 'statusMsg' + (isErr ? ' error' : '');
}

function detectStudyType(it) {
  if (it.study_type) return it.study_type.toLowerCase().replace(/[\s-]/g,'_');
  const t = ((it.title||'')+(it.abstract||'')).toLowerCase();
  if (/\brandom(is|iz)ed\b|\brct\b/.test(t)) return 'rct';
  if (/\bmeta.?analy/.test(t))               return 'meta_analysis';
  if (/\bsystematic\s+review\b/.test(t))     return 'systematic_review';
  if (/\bcohort\b/.test(t))                  return 'cohort';
  if (/\bcase.control\b/.test(t))            return 'case_control';
  if (/\bcase\s+report\b/.test(t))           return 'case_report';
  if (/\breview\b/.test(t))                  return 'review';
  if (/\beditorial\b/.test(t))               return 'editorial';
  if (/\bobservational\b/.test(t))           return 'observational';
  return null;
}

function normStr(x){ return (x??'').toString().trim(); }
function defaultCursor(src){ return src==='semantic_scholar'?'0':'*'; }
function parseYear(x){ const n=parseInt(String(x||'').trim(),10); return Number.isFinite(n)&&n>=1000&&n<=3000?n:null; }
function hasAbstract(it){ return stripHtml(it?.abstract||'').length>=20; }
function isOA(it){ return !!(it?.pmcid&&it.pmcid.toString().trim()); }
function titleMatch(it,q){ const tokens=(q||'').toLowerCase().trim().split(/\s+/).filter(w=>w.length>=3); if(!tokens.length)return true; return tokens.every(t=>(it?.title||'').toLowerCase().includes(t)); }
function authorMatch(it,needle){ if(!needle)return true; const a=it?.authors; if(!Array.isArray(a))return false; return a.some(x=>x.toLowerCase().includes(needle.toLowerCase())); }
function studyMatch(it,f){ if(!f)return true; return detectStudyType(it)===f; }

function getFilters(){
  return {
    q:        normStr($id('q').value),
    author:   normStr($id('author').value),
    yFrom:    parseYear($id('yearFrom').value),
    yTo:      parseYear($id('yearTo').value),
    studyType:$id('studyType').value||'',
    language: $id('language').value||'',
    needAbs:  $id('hasAbstract').checked,
    openAccess:$id('openAccess').checked,
    titleOnly: $id('titleOnly').checked,
  };
}

function applyFilters(items){
  const f=getFilters();
  return (items||[]).filter(it=>{
    if(f.needAbs&&!hasAbstract(it))             return false;
    if(f.openAccess&&!isOA(it))                 return false;
    if(f.titleOnly&&!titleMatch(it,f.q))         return false;
    if(!authorMatch(it,f.author))               return false;
    if(!studyMatch(it,f.studyType))             return false;
    const y=parseYear(it?.year);
    if(f.yFrom!==null&&y!==null&&y<f.yFrom)     return false;
    if(f.yTo!==null&&y!==null&&y>f.yTo)         return false;
    return true;
  });
}

function renderActiveFilters(){
  const f=getFilters();
  const chips=[];
  if(f.yFrom)      chips.push(`From ${f.yFrom}`);
  if(f.yTo)        chips.push(`To ${f.yTo}`);
  if(f.studyType)  chips.push(STUDY_TYPE_LABELS[f.studyType]||f.studyType);
  if(f.language)   chips.push(`Language: ${LANGUAGE_LABELS[f.language]||f.language}`);
  if(f.author)     chips.push(`Author: ${f.author}`);
  if(f.needAbs)    chips.push('Has abstract');
  if(f.openAccess) chips.push('Open access');
  if(f.titleOnly)  chips.push('Title match');
  $id('activeFilters').innerHTML = chips.map(c=>`<span class="badge brass">${esc(c)}</span>`).join('');
}

function studyTypeBadgeClass(t){
  if(t==='rct'||t==='meta_analysis'||t==='systematic_review') return 'green';
  if(t==='review'||t==='cohort') return 'blue';
  return 'brass';
}

function renderResults(itemsRaw){
  const wrap = $id('results');
  renderActiveFilters();
  const items = applyFilters(itemsRaw);
  const bulkBtn = $id('bulkSaveBtn');

  if(!items.length){
    if(bulkBtn) bulkBtn.style.display='none';
    const lastQuery = $id('q').value.trim();
    if(itemsRaw.length){
      // Results came back but filtered out
      wrap.innerHTML=`<div class="emptyResults"><p>No results match your current filters.</p><p style="margin-top:8px;"><button class="btn sm" onclick="document.getElementById('clearBtn').click()">Clear filters</button></p></div>`;
    } else if(lastQuery){
      // Query ran but returned nothing
      wrap.innerHTML=`<div class="emptyResults"><p>No papers found for "<strong>${esc(lastQuery)}</strong>".</p><p style="margin-top:6px;font-size:12.5px;color:var(--subtle);">Try adjusting your search terms, switching the source, or broadening your year range.</p></div>`;
    } else {
      wrap.innerHTML=`<div class="emptyResults"><p>Enter a query and hit Search to find papers.</p></div>`;
    }
    return;
  }

  if(bulkBtn) bulkBtn.style.display='';

  wrap.innerHTML = items.map((it,i)=>{
    const authors = Array.isArray(it.authors)?it.authors:[];
    const authorLine = authors.slice(0,4).join(', ')+(authors.length>4?' et al.':'');
    const dt = detectStudyType(it);
    const dtLabel = dt?(STUDY_TYPE_LABELS[dt]||dt):null;
    const oa = isOA(it);
    const abs = hasAbstract(it);
    const cleanAbstract = stripHtml(it.abstract);
    return `
      <div class="resultCard">
        <div class="resultTitle">${esc(it.title||'Untitled')}</div>
        ${authorLine?`<div class="resultAuthors">${esc(authorLine)}</div>`:''}
        <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;">
          ${it.year?`<span class="badge blue">${esc(String(it.year))}</span>`:''}
          ${it.venue?`<span class="badge" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(it.venue)}</span>`:''}
          <span class="badge coffee">${esc(SOURCE_LABELS[it.source]||it.source)}</span>
          ${dtLabel?`<span class="badge ${studyTypeBadgeClass(dt)}">${esc(dtLabel)}</span>`:''}
          ${oa?`<span class="badge green">Open Access</span>`:''}
        </div>
        ${abs?`<div class="resultAbstract" id="abs-${i}">${esc(cleanAbstract.slice(0,400))}${cleanAbstract.length>400?'…':''}</div>`:''}
        <div class="resultFooter">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${abs?`<button class="btn sm ghost" onclick="toggleAbs(${i})">Abstract</button>`:''}
          </div>
          <button class="btn primary sm" data-idx="${i}">Open →</button>
        </div>
      </div>`;
  }).join('');

  wrap.querySelectorAll('[data-idx]').forEach(btn=>{
    btn.onclick=()=>{
      const it=items[parseInt(btn.dataset.idx,10)];
      sessionStorage.setItem('last_external',JSON.stringify(it));
      sessionStorage.removeItem('open_study_id');
      window.location.href='paper.html';
    };
  });
}

window.toggleAbs=function(i){
  const el=$id(`abs-${i}`);
  if(el) el.classList.toggle('open');
};

function updateButtons(){
  $id('prevBtn').disabled = stack.length<=1;
  $id('nextBtn').disabled = !nextCursor;
}

function updateLabel(hitCount,rawCount,shownCount){
  const hc = hitCount??(__LAST_HIT_COUNT__??'?');
  $id('pageLabel').textContent = rawCount?`${hc} hits · p${stack.length} · ${shownCount}/${rawCount}`:'';
}

const STATE_KEY='seren_search_v5';
function saveState(){
  try{
    const f=getFilters();
    sessionStorage.setItem(STATE_KEY,JSON.stringify({
      q:f.q, source:$id('source').value, limit:$id('limit').value,
      filters:{author:f.author,yearFrom:$id('yearFrom').value,yearTo:$id('yearTo').value,studyType:f.studyType,language:f.language,hasAbstract:f.needAbs,openAccess:f.openAccess,titleOnly:f.titleOnly},
      stack, nextCursor
    }));
  }catch{}
}

async function loadSources(){
  try{
    const r=await fetchJson('/external/sources',{auth:false});
    const sources=r?.sources||[];
    if(!sources.length)return;
    const sel=$id('source');
    const cur=sel.value||'europepmc';
    sel.innerHTML='';
    sources.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=SOURCE_LABELS[s]||s; sel.appendChild(o); });
    sel.value=Array.from(sel.options).some(o=>o.value===cur)?cur:(sel.options[0]?.value||'europepmc');
  }catch{}
}

async function fetchPage(cursor){
  setMsg('');
  const seq=++__REQ_SEQ__;
  const q=$id('q').value.trim();
  const src=$id('source').value;
  const lim=parseInt($id('limit').value,10);
  const yFrom=parseYear($id('yearFrom').value);
  const yTo=parseYear($id('yearTo').value);
  const lang=$id('language').value;

  if(!q||q.length<2){ setMsg('Query must be at least 2 characters.',true); return; }

  // Append language directly into the query string for Europe PMC compatibility
  let formattedQuery = q;
  if (lang && src === 'europepmc') {
      formattedQuery = `(${q}) AND LANG:"${lang}"`;
  }

  let url=`/external/search?q=${encodeURIComponent(formattedQuery)}&source=${encodeURIComponent(src)}&limit=${lim}&cursor_mark=${encodeURIComponent(cursor)}`;
  if(yFrom!==null) url+=`&year_from=${yFrom}`;
  if(yTo!==null)   url+=`&year_to=${yTo}`;

  setMsg('Searching…');

  try{
    const data=await fetchJson(url,{auth:false});
    if(seq!==__REQ_SEQ__)return;
    nextCursor=data?.next_cursor_mark||null;
    __LAST_ITEMS__=Array.isArray(data?.items)?data.items:[];
    __LAST_HIT_COUNT__=data?.hit_count??null;
    const shown=applyFilters(__LAST_ITEMS__).length;
    updateLabel(__LAST_HIT_COUNT__,__LAST_ITEMS__.length,shown);
    setMsg('');
    renderResults(__LAST_ITEMS__);
    updateButtons();
    saveState();
  }catch(e){
    if(seq!==__REQ_SEQ__)return;
    setMsg(e.message,true);
    nextCursor=null;
    updateButtons();
  }
}

async function newSearch(){
  stack=[defaultCursor($id('source').value)];
  nextCursor=null; __LAST_ITEMS__=[]; __LAST_HIT_COUNT__=null;
  $id('pageLabel').textContent='';
  updateButtons();
  await fetchPage(stack[0]);
}

function clearFilters(){
  $id('author').value=''; $id('yearFrom').value=''; $id('yearTo').value='';
  $id('studyType').value=''; $id('language').value=''; $id('hasAbstract').checked=false;
  $id('openAccess').checked=false; $id('titleOnly').checked=false;
  renderResults(__LAST_ITEMS__);
  updateLabel(null,__LAST_ITEMS__.length,applyFilters(__LAST_ITEMS__).length);
}

$id('searchBtn').onclick = newSearch;
$id('clearBtn').onclick  = clearFilters;

// Bulk save
$id('bulkSaveBtn').onclick = async () => {
  const items = applyFilters(__LAST_ITEMS__);
  if(!items.length) return;
  const ok = await confirmModal({
    title: `Save ${items.length} paper${items.length!==1?'s':''} to Library?`,
    message: `This will add all ${items.length} results on this page to your library. Already-saved papers will be skipped.`,
    okText: 'Save all',
    cancelText: 'Cancel',
  });
  if(!ok) return;
  const token = getToken ? getToken() : null;
  if(!token){ showToast('Sign in required','Sign in to save papers.','error'); return; }
  await withBtnLoading($id('bulkSaveBtn'), async () => {
    let saved=0, skipped=0, errors=0;
    for(const it of items){
      try{
        await fetchJson('/studies',{method:'POST',body:{
          title: it.title||'Untitled', abstract: it.abstract||'', doi: it.doi||'',
          year: it.year||null, source: it.source||'', pmid: it.pmid||'',
          pmcid: it.pmcid||'', venue: it.venue||'',
          authors: Array.isArray(it.authors)?it.authors.join(', '):'',
        }});
        saved++;
      }catch(e){
        if(e.message&&e.message.includes('409')) skipped++;
        else errors++;
      }
    }
    showToast('Bulk save done',`${saved} saved${skipped?`, ${skipped} already in library`:''}${errors?`, ${errors} errors`:''}`,errors?'warn':'success');
  });
};
$id('nextBtn').onclick   = async()=>{ if(!nextCursor)return; stack.push(nextCursor); await fetchPage(nextCursor); };
$id('prevBtn').onclick   = async()=>{ if(stack.length<=1)return; stack.pop(); await fetchPage(stack[stack.length-1]); };
$id('q').addEventListener('keydown',e=>{ if(e.key==='Enter') newSearch(); });

['author','hasAbstract','openAccess','titleOnly','studyType','language'].forEach(id=>{
  const el=$id(id); if(!el)return;
  const evt=el.type==='checkbox'?'change':'input';
  let t=null;
  el.addEventListener(evt,()=>{ clearTimeout(t); t=setTimeout(()=>{ renderResults(__LAST_ITEMS__); updateLabel(null,__LAST_ITEMS__.length,applyFilters(__LAST_ITEMS__).length); },120); });
});

['yearFrom','yearTo'].forEach(id=>{
  const el=$id(id); if(!el)return;
  let t=null;
  el.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(async()=>{ const c=stack[stack.length-1]||defaultCursor($id('source').value); await fetchPage(c); },380); });
});

(async()=>{
  await loadSources();
  try{
    const st=JSON.parse(sessionStorage.getItem(STATE_KEY)||'null');
    if(st){
      $id('q').value=$id('q').value||st.q||'';
      $id('limit').value=String(st.limit||'25');
      $id('source').value=st.source||'europepmc';
      const f=st.filters||{};
      $id('author').value=f.author||''; $id('yearFrom').value=f.yearFrom||'';
      $id('yearTo').value=f.yearTo||''; $id('studyType').value=f.studyType||'';
      $id('language').value=f.language||'';
      $id('hasAbstract').checked=!!f.hasAbstract; $id('openAccess').checked=!!f.openAccess; $id('titleOnly').checked=!!f.titleOnly;
      stack=Array.isArray(st.stack)&&st.stack.length?st.stack:[defaultCursor($id('source').value)];
      nextCursor=st.nextCursor||null;
      if($id('q').value.trim().length>=2){ await fetchPage(stack[stack.length-1]||stack[0]); updateButtons(); return; }
    }
  }catch{}
  if($id('q').value.trim().length>=2) await newSearch();
})();
</script>
