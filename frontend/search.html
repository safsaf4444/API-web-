<!-- frontend/search.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Search - Medical Evidence</title>
  <link rel="stylesheet" href="styles.css"/>
</head>

<body class="appDark">
<header>
  <div class="headerInner">
    <div class="brand">Medical Evidence</div>
    <nav id="nav"></nav>
  </div>
</header>

<main>
  <div class="card">
    <h2>Search</h2>

    <div class="row">
      <div style="flex:2">
        <label>Query</label>
        <input id="q" placeholder="e.g. creatine" value="creatine"/>
      </div>

      <div style="flex:1">
        <label>Source</label>
        <select id="source">
          <option value="europepmc">Europe PMC</option>
          <option value="semantic_scholar">Semantic Scholar</option>
          <option value="openalex">OpenAlex</option>
          <option value="crossref">Crossref</option>
        </select>
      </div>

      <div style="flex:1">
        <label>Page size</label>
        <select id="limit">
          <option>10</option>
          <option selected>25</option>
          <option>50</option>
        </select>
      </div>
    </div>

    <div class="row" style="margin-top:10px;">
      <div style="flex:1">
        <label>Author contains</label>
        <input id="author" placeholder="e.g. smith"/>
      </div>

      <div style="flex:1">
        <label>Year from</label>
        <input id="yearFrom" inputmode="numeric" placeholder="e.g. 2015"/>
      </div>

      <div style="flex:1">
        <label>Year to</label>
        <input id="yearTo" inputmode="numeric" placeholder="e.g. 2024"/>
      </div>

      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;">
        <label style="opacity:.8;">Options</label>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
          <label class="small" style="display:flex;gap:8px;align-items:center;">
            <input type="checkbox" id="hasAbstract"/>
            has abstract
          </label>
          <label class="small" style="display:flex;gap:8px;align-items:center;">
            <input type="checkbox" id="titleOnly"/>
            title contains query
          </label>
        </div>
      </div>
    </div>

    <div class="row" style="margin-top:10px;">
      <button class="primary" id="searchBtn">Search</button>
      <button class="ghost" id="prevBtn" disabled>Prev</button>
      <button class="ghost" id="nextBtn" disabled>Next</button>
      <button class="ghost" id="clearBtn" title="Clear filters">Clear</button>
      <div class="small" id="pageLabel"></div>
    </div>

    <div id="msg" class="small"></div>
  </div>

  <div class="card">
    <h3>Results</h3>
    <div id="results" class="list"></div>
  </div>
</main>

<script src="api.js"></script>
<script src="app.js"></script>

<script>
let stack = [];
let nextCursor = null;

// ✅ keep last fetched page so filters don't trigger refetch
let __LAST_ITEMS__ = [];
let __LAST_HIT_COUNT__ = null;

// ✅ request sequencing (avoids AbortError + avoids old responses overwriting new)
let __REQ_SEQ__ = 0;

const SOURCE_LABELS = {
  europepmc: "Europe PMC",
  semantic_scholar: "Semantic Scholar",
  openalex: "OpenAlex",
  crossref: "Crossref",
};

const STATE_KEY = "me_search_state_v4";

function setMsg(html) { qs("msg").innerHTML = html || ""; }
function normStr(x){ return (x ?? "").toString().trim(); }

function defaultCursorFor(source) {
  return source === "semantic_scholar" ? "0" : "*";
}

function parseYear(x){
  const n = parseInt(String(x || "").trim(), 10);
  if (!Number.isFinite(n)) return null;
  if (n < 1000 || n > 3000) return null;
  return n;
}

function normalizeAuthorsForDisplay(it){
  const a = it?.authors;
  if (!a) return [];
  if (Array.isArray(a)) return a.map(x => (x ?? "").toString().trim()).filter(Boolean);
  return [];
}

function hasUsefulAbstract(it){
  const a = (it?.abstract || "").toString().trim();
  return a.length >= 20;
}

function titleContainsQuery(it, q){
  const t = (it?.title || "").toString().toLowerCase();
  const qq = (q || "").toString().toLowerCase().trim();
  if (!qq) return true;
  const tokens = qq.split(/\s+/).filter(w => w.length >= 3);
  if (!tokens.length) return t.includes(qq);
  return tokens.every(tok => t.includes(tok));
}

function authorMatches(it, authorNeedle){
  const needle = (authorNeedle || "").toString().toLowerCase().trim();
  if (!needle) return true;

  const authors = normalizeAuthorsForDisplay(it);
  if (!authors.length) return false;
  return authors.some(a => a.toLowerCase().includes(needle));
}

function applyFilters(items){
  const q = normStr(qs("q").value);
  const author = normStr(qs("author").value);
  const yFrom = parseYear(qs("yearFrom").value);
  const yTo = parseYear(qs("yearTo").value);
  const needAbs = qs("hasAbstract").checked;
  const titleOnly = qs("titleOnly").checked;

  return (items || []).filter(it => {
    if (needAbs && !hasUsefulAbstract(it)) return false;
    if (titleOnly && !titleContainsQuery(it, q)) return false;

    const y = parseYear(it?.year);

    // ✅ missing years do NOT get excluded
    if (yFrom !== null) {
      if (y !== null && y < yFrom) return false;
    }
    if (yTo !== null) {
      if (y !== null && y > yTo) return false;
    }

    if (!authorMatches(it, author)) return false;
    return true;
  });
}

function renderResults(itemsRaw) {
  const wrap = qs("results");
  wrap.innerHTML = "";

  const items = applyFilters(itemsRaw);

  if (!items || !items.length) {
    wrap.innerHTML = `<div class="empty">No results (after filters).</div>`;
    return;
  }

  for (const it of items) {
    const authors = normalizeAuthorsForDisplay(it);
    const authorLine = authors.length ? authors.slice(0, 6).join(", ") : "";

    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="itemTitle">${escapeHtml(it.title)}</div>

      ${authorLine ? `<div class="small" style="opacity:.9;margin-top:6px;">${escapeHtml(authorLine)}${authors.length > 6 ? "…" : ""}</div>` : ""}

      <div class="itemMeta" style="margin-top:8px;">
        ${it.year ? `<span class="badge">${escapeHtml(it.year)}</span>` : ""}
        ${it.venue ? `<span class="badge">${escapeHtml(it.venue)}</span>` : ""}
        <span class="badge blue">${escapeHtml(SOURCE_LABELS[it.source] || it.source)}</span>
        ${hasUsefulAbstract(it) ? `<span class="badge green">abstract</span>` : ``}
      </div>

      <div class="itemActions">
        <button class="primary">Open</button>
      </div>
    `;

    div.querySelector("button").onclick = () => {
      sessionStorage.setItem("last_external", JSON.stringify(it));
      sessionStorage.removeItem("open_study_id");
      window.location.href = "paper.html";
    };

    wrap.appendChild(div);
  }
}

function updateButtons() {
  qs("prevBtn").disabled = stack.length <= 1;
  qs("nextBtn").disabled = !nextCursor;
}

function saveState(){
  try{
    const state = {
      q: qs("q").value || "",
      source: qs("source").value || "europepmc",
      limit: qs("limit").value || "25",
      filters: {
        author: qs("author").value || "",
        yearFrom: qs("yearFrom").value || "",
        yearTo: qs("yearTo").value || "",
        hasAbstract: !!qs("hasAbstract").checked,
        titleOnly: !!qs("titleOnly").checked,
      },
      stack,
      nextCursor,
      savedAt: Date.now(),
    };
    sessionStorage.setItem(STATE_KEY, JSON.stringify(state));
  }catch{}
}

function loadState(){
  try{
    const raw = sessionStorage.getItem(STATE_KEY);
    if(!raw) return null;
    const st = JSON.parse(raw);
    if(!st || typeof st !== "object") return null;
    return st;
  }catch{
    return null;
  }
}

async function loadSources(){
  try{
    const r = await fetchJson("/external/sources", { auth:false });
    const sources = (r && r.sources) ? r.sources : [];

    const sel = qs("source");
    if (!sel) return;

    const cur = sel.value || "europepmc";

    sel.innerHTML = "";
    for (const src of sources) {
      const opt = document.createElement("option");
      opt.value = src;
      opt.textContent = SOURCE_LABELS[src] || src;
      sel.appendChild(opt);
    }

    if (!sources.length) {
      sel.innerHTML = `
        <option value="europepmc">Europe PMC</option>
        <option value="semantic_scholar">Semantic Scholar</option>
        <option value="openalex">OpenAlex</option>
        <option value="crossref">Crossref</option>
      `;
    }

    sel.value = Array.from(sel.options).some(o => o.value === cur) ? cur : (sel.options[0]?.value || "europepmc");
  }catch{}
}

function updateLabelWithCounts(serverHitCount, rawCount, shownCount){
  const hc = (serverHitCount !== null && serverHitCount !== undefined) ? serverHitCount : (__LAST_HIT_COUNT__ ?? "?");
  qs("pageLabel").textContent =
    `hit_count: ${hc} • ` +
    `page: ${stack.length} • ` +
    `shown: ${shownCount}/${rawCount} • ` +
    `next: ${nextCursor ? "yes" : "no"}`;
}

async function fetchPage(cursor) {
  setMsg("");

  const mySeq = ++__REQ_SEQ__;

  const q = qs("q").value.trim();
  const source = qs("source").value;
  const limit = parseInt(qs("limit").value, 10);

  const yFrom = parseYear(qs("yearFrom").value);
  const yTo = parseYear(qs("yearTo").value);

  if (!q || q.length < 2) {
    setMsg(`<span class="error">Query must be at least 2 characters.</span>`);
    return;
  }

  // ✅ only year range is sent to backend; other filters are purely client-side
  const yearParams =
    (yFrom !== null || yTo !== null)
      ? `&year_from=${encodeURIComponent(yFrom ?? "")}&year_to=${encodeURIComponent(yTo ?? "")}`
      : "";

  const url =
    `/external/search?q=${encodeURIComponent(q)}` +
    `&source=${encodeURIComponent(source)}` +
    `&limit=${encodeURIComponent(limit)}` +
    `&cursor_mark=${encodeURIComponent(cursor)}` +
    yearParams;

  try {
    // ✅ use fetchJson for consistent errors + JSON parsing
    const data = await fetchJson(url, { auth:false });

    // ✅ ignore stale response if a newer request finished first
    if (mySeq !== __REQ_SEQ__) return;

    nextCursor = data?.next_cursor_mark || null;

    __LAST_ITEMS__ = Array.isArray(data?.items) ? data.items : [];
    __LAST_HIT_COUNT__ = (data && (data.hit_count ?? null)) ?? null;

    const shown = applyFilters(__LAST_ITEMS__).length;
    updateLabelWithCounts(__LAST_HIT_COUNT__, __LAST_ITEMS__.length, shown);

    renderResults(__LAST_ITEMS__);
    updateButtons();
    saveState();
  } catch (e) {
    if (mySeq !== __REQ_SEQ__) return;

    const hint =
      (qs("source").value === "semantic_scholar")
        ? "Semantic Scholar rate limits hard. Reduce page size, or wait. You can also set SEMANTIC_SCHOLAR_API_KEY on the backend."
        : "Some sources rate limit sometimes. Reduce page size or wait a bit.";

    setMsg(`<span class="error">${escapeHtml(e.message)}</span><br/><span class="small">${escapeHtml(hint)}</span>`);
    nextCursor = null;
    updateButtons();
    saveState();
  }
}

async function newSearch() {
  stack = [defaultCursorFor(qs("source").value)];
  nextCursor = null;
  __LAST_ITEMS__ = [];
  __LAST_HIT_COUNT__ = null;

  qs("pageLabel").textContent = "";
  qs("results").innerHTML = "";
  updateButtons();

  saveState();
  await fetchPage(stack[0]);
}

function clearFilters(){
  qs("author").value = "";
  qs("yearFrom").value = "";
  qs("yearTo").value = "";
  qs("hasAbstract").checked = false;
  qs("titleOnly").checked = false;
  saveState();

  // ✅ re-render current page instantly (no refetch)
  renderResults(__LAST_ITEMS__);
  const shown = applyFilters(__LAST_ITEMS__).length;
  updateLabelWithCounts(null, __LAST_ITEMS__.length, shown);
}

qs("searchBtn").onclick = newSearch;

qs("nextBtn").onclick = async () => {
  if (!nextCursor) return;
  stack.push(nextCursor);
  await fetchPage(nextCursor);
};

qs("prevBtn").onclick = async () => {
  if (stack.length <= 1) return;
  stack.pop();
  const prevCursor = stack[stack.length - 1];
  await fetchPage(prevCursor);
};

qs("clearBtn").onclick = () => {
  clearFilters();
};

// ✅ filters re-render locally; only year change triggers refetch (optional)
(function wireLiveFilters(){
  const localOnly = ["author","hasAbstract","titleOnly"];
  const yearIds = ["yearFrom","yearTo"];

  let t = null;

  localOnly.forEach(id => {
    const el = qs(id);
    if(!el) return;
    const evt = (el.type === "checkbox") ? "change" : "input";
    el.addEventListener(evt, ()=>{
      if(t) clearTimeout(t);
      t = setTimeout(()=>{
        renderResults(__LAST_ITEMS__);
        const shown = applyFilters(__LAST_ITEMS__).length;
        updateLabelWithCounts(null, __LAST_ITEMS__.length, shown);
        saveState();
      }, 150);
    });
  });

  // year changes refetch (because backend-level filtering is more efficient)
  yearIds.forEach(id => {
    const el = qs(id);
    if(!el) return;
    el.addEventListener("input", ()=>{
      if(t) clearTimeout(t);
      t = setTimeout(async ()=>{
        const cur = stack[stack.length - 1] || defaultCursorFor(qs("source").value);
        await fetchPage(cur);
      }, 260);
    });
    el.addEventListener("change", ()=> saveState());
  });
})();

(async ()=>{
  await loadSources();

  const st = loadState();
  if (st){
    qs("q").value = st.q || "";
    qs("limit").value = String(st.limit || "25");
    qs("source").value = st.source || "europepmc";

    const f = st.filters || {};
    qs("author").value = f.author || "";
    qs("yearFrom").value = f.yearFrom || "";
    qs("yearTo").value = f.yearTo || "";
    qs("hasAbstract").checked = !!f.hasAbstract;
    qs("titleOnly").checked = !!f.titleOnly;

    stack = Array.isArray(st.stack) && st.stack.length ? st.stack : [defaultCursorFor(qs("source").value)];
    nextCursor = st.nextCursor || null;

    const cur = stack[stack.length - 1] || stack[0];
    await fetchPage(cur);
    updateButtons();
  } else {
    await newSearch();
  }
})();
</script>
</body>
</html>
