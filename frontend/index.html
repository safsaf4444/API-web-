<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Seren — Medical Evidence</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .homeContainer {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* Hero */
    .heroSection {
      background: linear-gradient(135deg, var(--navy) 0%, #1a2535 100%);
      border-radius: var(--r-lg);
      padding: 56px 48px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .heroSection::before {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
      opacity: .3; pointer-events: none;
    }
    .heroSection::after {
      content: '';
      position: absolute; top: -60px; right: -60px;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(201,168,124,.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .heroMark {
      font-family: var(--font-display);
      font-size: 13px; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--brass); margin-bottom: 16px;
    }
    .heroTitle {
      font-family: var(--font-display);
      font-size: clamp(28px, 4vw, 44px); font-weight: 700;
      color: var(--cream); line-height: 1.18; letter-spacing: -.025em;
      margin-bottom: 14px;
    }
    .heroSub {
      font-size: 15px; color: rgba(245,240,232,.55);
      line-height: 1.7; max-width: 520px; margin-bottom: 28px;
    }
    .heroCTA { display: flex; gap: 10px; flex-wrap: wrap; }
    .heroCTA .btn.primary {
      background: var(--brass); border-color: var(--brass);
      color: var(--navy); font-weight: 700; font-size: 13.5px; padding: 10px 22px;
    }
    .heroCTA .btn.primary:hover { background: #d4b48a; }
    .heroCTA .btn.ghost {
      background: transparent; border-color: rgba(245,240,232,.2);
      color: rgba(245,240,232,.7);
    }
    .heroCTA .btn.ghost:hover { border-color: rgba(245,240,232,.4); color: var(--cream); background: rgba(245,240,232,.05); }

    /* Stats bar */
    .statsBar {
      display: flex; gap: 0;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); overflow: hidden;
      margin-bottom: 20px; box-shadow: var(--shadow-xs);
    }
    .statItem {
      flex: 1; padding: 16px 20px;
      border-right: 1px solid var(--line); text-align: center;
    }
    .statItem:last-child { border-right: none; }
    .statNum {
      font-family: var(--font-display); font-size: 22px;
      font-weight: 700; color: var(--navy);
    }
    .statLabel { font-size: 11px; color: var(--subtle); font-weight: 500; margin-top: 2px; }

    /* Two-column layout below hero */
    .homeGrid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      margin-bottom: 20px;
    }

    .homeGridLeft { display: flex; flex-direction: column; gap: 16px; }
    .homeGridRight { display: flex; flex-direction: column; gap: 16px; }

    /* Widget card base */
    .widgetCard {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); box-shadow: var(--shadow-xs);
      overflow: hidden;
    }
    .widgetHeader {
      padding: 14px 18px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
    }
    .widgetTitle {
      font-size: 11px; font-weight: 700; letter-spacing: .09em;
      text-transform: uppercase; color: var(--subtle);
    }
    .widgetBody { padding: 14px 18px; }

    /* Paper of the Day */
    .potdCard {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .potdCard::after {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(201,168,124,.12), transparent 70%);
      pointer-events: none;
    }
    .potdLabel {
      font-size: 10px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--brass); margin-bottom: 10px;
    }
    .potdTitle {
      font-family: var(--font-display); font-size: 15px; font-weight: 600;
      color: var(--cream); line-height: 1.45; margin-bottom: 10px;
    }
    .potdSummary { font-size: 12.5px; color: rgba(245,240,232,.55); line-height: 1.65; margin-bottom: 14px; }
    .potdMeta { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Trending topics */
    .trendingItem {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--line2);
      cursor: pointer; transition: background .12s;
    }
    .trendingItem:last-child { border-bottom: none; padding-bottom: 0; }
    .trendingItem:hover { background: var(--cream3); margin: 0 -18px; padding-left: 18px; padding-right: 18px; }
    .trendingRank { font-size: 12px; font-weight: 700; color: var(--subtle); width: 18px; text-align: right; flex-shrink: 0; }
    .trendingName { font-size: 13px; color: var(--navy); font-weight: 500; flex: 1; }
    .trendingBar {
      height: 4px; background: var(--brass-light); border-radius: 4px;
      width: var(--w, 0%); transition: width .6s ease;
    }

    /* Community posts widget */
    .communityPostRow {
      padding: 12px 0; border-bottom: 1px solid var(--line2);
      cursor: pointer; transition: all .12s;
    }
    .communityPostRow:last-child { border-bottom: none; }
    .communityPostRow:hover { background: var(--cream3); margin: 0 -18px; padding-left: 18px; padding-right: 18px; }
    .communityPostRowTitle { font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 4px; line-height: 1.4; }
    .communityPostRowMeta { font-size: 11.5px; color: var(--subtle); display: flex; gap: 8px; }

    .postTypePip {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; flex-shrink: 0; margin-top: 4px;
    }
    .postTypePip.question   { background: var(--navy3); }
    .postTypePip.discussion { background: var(--brass2); }
    .postTypePip.case_study { background: var(--good); }
    .postTypePip.resource   { background: var(--warn); }

    /* Feature grid */
    .featureGrid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .featureCard {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); padding: 18px;
      box-shadow: var(--shadow-xs);
      transition: all .15s; text-decoration: none; display: block; cursor: pointer;
    }
    .featureCard:hover { border-color: rgba(201,168,124,.35); box-shadow: var(--shadow-sm); transform: translateY(-2px); }
    .featureIcon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, rgba(201,168,124,.15), rgba(201,168,124,.05));
      border: 1px solid rgba(201,168,124,.2);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px; color: var(--brass2);
    }
    .featureName { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
    .featureDesc { font-size: 12px; color: var(--muted); line-height: 1.6; }

    /* Quick search hero bar */
    .heroSearchBar {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--r-pill); padding: 10px 18px;
      max-width: 480px; margin-bottom: 20px;
      backdrop-filter: blur(4px);
    }
    .heroSearchBar input {
      border: 0; outline: none; background: transparent;
      font-size: 14px; color: var(--cream); width: 100%;
    }
    .heroSearchBar input::placeholder { color: rgba(245,240,232,.4); }
    .heroSearchBar button {
      background: var(--brass); border: none; color: var(--navy);
      font-weight: 700; font-size: 12.5px; padding: 6px 14px;
      border-radius: var(--r-pill); cursor: pointer; white-space: nowrap;
      transition: background .14s; box-shadow: none;
    }
    .heroSearchBar button:hover { background: var(--brass-light); transform: none; }

    @media (max-width: 800px) {
      .homeGrid { grid-template-columns: 1fr; }
      .heroSection { padding: 36px 24px; }
      .statsBar { display: grid; grid-template-columns: 1fr 1fr; }
      .statItem { border-right: none; border-bottom: 1px solid var(--line); }
      .statItem:nth-child(odd) { border-right: 1px solid var(--line); }
    }
  </style>
</head>
<body>
<main class="homeContainer">

  <!-- Hero -->
  <div class="heroSection">
    <div class="heroMark" style="position:relative;z-index:1;">Seren · Medical Evidence</div>
    <div class="heroTitle" style="position:relative;z-index:1;">Research smarter.<br/>Build evidence.</div>
    <div class="heroSub" style="position:relative;z-index:1;">Search 4 providers, analyse papers with AI, synthesise bodies of evidence, and discuss with the community — all in one place.</div>
    <div class="heroSearchBar" style="position:relative;z-index:1;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(245,240,232,.5)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="heroSearchInput" placeholder="Search literature… e.g. 'beta-blockers heart failure'" autocomplete="off"/>
      <button id="heroSearchBtn">Search →</button>
    </div>
    <div class="heroCTA" style="position:relative;z-index:1;">
      <button class="btn primary" onclick="location.href='search.html'">Open search</button>
      <button class="btn ghost" onclick="location.href='community.html'">Community</button>
      <button class="btn ghost" id="landingSignInBtn" onclick="location.href='login.html'" style="display:none;">Sign in</button>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="statsBar">
    <div class="statItem">
      <div class="statNum" id="statPapers">—</div>
      <div class="statLabel">Papers analysed</div>
    </div>
    <div class="statItem">
      <div class="statNum" id="statSynths">—</div>
