<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Paper — Seren</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    /* ── Paper layout overrides ── */
    #paperSplit {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) 380px;
      gap: 20px;
      align-items: start;
      max-width: none;
    }
    #paperSplit.drawerMode       { grid-template-columns: 1fr; }
    #paperSplit.panelClosed .paperRight { display: none; }
    #paperSplit.drawerMode .paperRight {
      position: fixed;
      right: 20px; top: 76px; bottom: 20px;
      width: min(420px, calc(100vw - 40px));
      z-index: 1200;
      overflow-y: auto;
    }
    @media (max-width: 1000px) {
      #paperSplit { grid-template-columns: 1fr; }
      #paperSplit .paperRight { position: static; }
    }

    .paperLeft  { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .paperRight { position: sticky; top: 76px; min-width: 0; }

    /* Panel card fills available height */
    .paperRight .card {
      height: calc(100vh - 100px);
      min-height: 420px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (max-width: 1000px) {
      .paperRight .card { height: auto; min-height: 500px; }
    }

    /* Paper title */
    .paperTitle {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.4;
      letter-spacing: -0.015em;
      margin-bottom: 10px;
    }

    /* Save row */
    .saveRow {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 14px;
      border-top: 1px solid var(--line2);
    }
    .saveRow select { width: auto; min-width: 130px; padding: 7px 10px; font-size: 13px; }
    #saveMsg { font-size: 12.5px; min-height: 16px; margin-top: 6px; }

    /* Section headers */
    .sectionLabel {
      font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--subtle); margin-bottom: 10px;
    }

    /* Abstract */
    .abstractBox { font-size: 13.5px; line-height: 1.78; color: var(--text2); }
    .abstractBox p { margin: 0 0 10px; }
    .abstractBox p:last-child { margin-bottom: 0; }

    /* Authors */
    #authorsBox { font-size: 13px; color: var(--muted); line-height: 1.7; }

    /* Full text */
    #fullTextBox {
      font-size: 13px; line-height: 1.78; color: var(--text2);
      max-height: 520px; overflow-y: auto; margin-top: 12px;
    }
    #fullTextBox p { margin: 0 0 12px; }
    #fullTextHint { font-size: 12.5px; color: var(--subtle); line-height: 1.6; }

    /* Panel internals */
    .panelTopRow {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 12px; flex-shrink: 0;
    }
    .panelLabel { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--navy); }
    .panelCtrl  { display: flex; gap: 6px; }
    .panelBody  { flex: 1; overflow-y: auto; margin-top: 12px; }

    .hr { border: none; border-top: 1px solid var(--line2); margin: 12px 0; }
  </style>
</head>

<body>
<main id="paperSplit">

  <div class="paperLeft">

    <div class="card">
      <div class="paperTitle" id="title">Loading…</div>
      <div id="meta"></div>
      <div class="saveRow">
        <button type="button" class="btn primary" id="saveBtn">Save to library</button>
        <button type="button" class="btn" id="openBtn" disabled>Open DOI ↗</button>
        <select id="saveFolderPick"><option value="">No folder</option></select>
      </div>
      <div id="saveMsg"></div>
    </div>

    <div class="card" id="authorsCard" style="display:none;">
      <div class="sectionLabel">Authors</div>
      <div class="hr"></div>
      <div id="authorsBox"></div>
    </div>

    <div class="card">
      <div class="sectionLabel">Abstract</div>
      <div class="hr"></div>
      <div class="abstractBox" id="abstract">
        <span style="color:var(--subtle);font-style:italic;">Loading…</span>
      </div>
    </div>

    <div class="card">
      <div class="sectionLabel">Full Text (Open Access)</div>
      <div class="hr"></div>
      <div id="fullTextHint">If the paper has an Open Access full text (via PMCID in Europe PMC), you can load it here.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button type="button" class="btn primary sm" id="loadFullBtn" disabled>Load full text (OA)</button>
        <button type="button" class="btn sm" id="openFullBtn" disabled>Open provider page ↗</button>
      </div>
      <div class="hr"></div>
      <div id="fullTextBox">
        <span style="color:var(--subtle);font-style:italic;font-size:13px;">Not loaded.</span>
      </div>
    </div>

  </div>

  <div class="paperRight">
    <div class="card">
      <div class="panelTopRow">
        <div class="panelLabel">Panel</div>
        <div class="panelCtrl">
          <button type="button" class="btn sm ghost" id="modeBtn">⇄ Side</button>
          <button type="button" class="btn sm ghost" id="closeBtn">✕</button>
        </div>
      </div>

      <div class="tabPills" style="flex-shrink:0;">
        <div class="tabPill active" data-tab="thread">Thread</div>
        <div class="tabPill" data-tab="ai">AI</div>
        <div class="tabPill" data-tab="related">Related</div>
      </div>

      <div class="panelBody" id="panel"></div>
    </div>
  </div>

</main>

<script src="api.js"></script>
<script src="app.js"></script>

<script>
if (window.__ME_PAPER_INIT__) {
  // already initialised — do nothing
} else {
window.__ME_PAPER_INIT__ = true;

let external    = null;
let savedStudy  = null;
let meUser      = null;

let __SAVE_IN_FLIGHT__       = false;
let __THREAD_IN_FLIGHT__     = false;
let __THREAD_LAST_FETCH_AT__ = 0;
const THREAD_FETCH_THROTTLE_MS = 700;
let __THREAD_SHELL_READY__   = false;

let __AI_MESSAGES__ = [];
let __AI_BASE__     = null;
let __AI_WIRED__    = false;

function setSaveMsg(html) { qs("saveMsg").innerHTML = html || ""; }
function setPanel(html)   { qs("panel").innerHTML   = html || ""; }
function setFullText(html){ qs("fullTextBox").innerHTML = html || ""; }

function getCurrentPaper() {
  const ext = sessionStorage.getItem("last_external");
  if (ext) {
    try { return { mode:"external", paper: JSON.parse(ext) }; }
    catch { sessionStorage.removeItem("last_external"); }
  }
  const id = sessionStorage.getItem("open_study_id");
  if (id) return { mode:"saved", id: parseInt(id, 10) };
  return { mode:"none" };
}

async function ensureMe() {
  if (!getToken()) return null;
  if (meUser) return meUser;
  try { meUser = await fetchJson("/me"); } catch { meUser = null; }
  return meUser;
}

async function ensureSavedStudy() {
  if (savedStudy) return savedStudy;
  const id = sessionStorage.getItem("open_study_id");
  if (id && getToken()) {
    try {
      savedStudy = await fetchJson(`/studies/${parseInt(id,10)}`);
      return savedStudy;
    } catch {
      sessionStorage.removeItem("open_study_id");
      savedStudy = null;
    }
  }
  if (external && getToken()) {
    const saved = await fetchJson("/external/import", { method:"POST", body: external });
    savedStudy = saved;
    sessionStorage.setItem("open_study_id", String(saved.id));
    sessionStorage.removeItem("last_external");
    qs("saveBtn").textContent = "Saved";
    qs("saveBtn").disabled = true;
    setSaveMsg(`<span class="badge green">Saved</span>`);
    return savedStudy;
  }
  return null;
}

function normStr(x) { return (x || "").toString().trim(); }

function stripHtml(s) {
  // Enhanced to strip all entities and malformed tags safely
  return (s || "")
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/&[a-z]+;/gi, " ")
    .replace(/&#\d+;/gi, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function shortTitleKeywords(title) {
  const stop = new Set(["the","and","or","of","to","in","for","a","an","with","on","by","from","at","as","is","are"]);
  return (title || "")
    .toLowerCase()
    .replace(/[^a-z0-9\s-]/g, " ")
    .split(/\s+/)
    .filter(w => w.length >= 4 && !stop.has(w))
    .slice(0, 8)
    .join(" ");
}

function hasUsefulAbstract(p) {
  const a = stripHtml(p?.abstract || "");
  return a && a.length >= 60;
}

function normalizeAuthors(p) {
  if (!p) return [];
  const a = p.authors;
  if (!a) return [];
  if (Array.isArray(a)) return a.map(x => (x ?? "").toString().trim()).filter(Boolean);
  if (typeof a === "string") return a.split(",").map(x => x.trim()).filter(Boolean);
  return [];
}

function looksLikeApiUrl(u) {
  if (!u) return false;
  const s = String(u).toLowerCase();
  return s.startsWith("https://api.") || s.startsWith("http://api.")
    || s.includes("api.elsevier.com") || s.includes("/content/")
    || s.endsWith(".xml") || s.includes(".xml?") || s.endsWith("/xml");
}

function doiUrl(p) {
  const doi = normStr(p?.doi);
  return doi ? `https://doi.org/${encodeURIComponent(doi)}` : "";
}

function providerUrl(p) {
  if (p && p.url && !looksLikeApiUrl(p.url)) return p.url;
  const src   = (p.source || "").toLowerCase();
  const pmcid = normStr(p.pmcid);
  const pmid  = normStr(p.pmid);
  const doi   = normStr(p.doi);
  if (src === "europepmc") {
    if (pmcid) return `https://europepmc.org/article/PMC/${encodeURIComponent(pmcid)}`;
    if (pmid)  return `https://europepmc.org/article/MED/${encodeURIComponent(pmid)}`;
    if (doi)   return `https://europepmc.org/article/DOI/${encodeURIComponent(doi)}`;
  }
  if (doi) return `https://doi.org/${encodeURIComponent(doi)}`;
  return "";
}

function bestHumanLink(p) {
  const d = doiUrl(p);
  if (d) return d;
  const u = providerUrl(p);
  return (u && !looksLikeApiUrl(u)) ? u : "";
}

function canLoadOAFullText(p) { return !!normStr(p?.pmcid); }

function formatAbstractHtml(raw) {
  const clean = stripHtml(raw);
  if (!clean) return `<span style="color:var(--subtle);font-style:italic;">No abstract available.</span>`;

  const re = /(Background|Objective|Objectives|Methods|Method|Design|Participants|Interventions|Main outcome measures|Results|Conclusion|Conclusions|Discussion|Interpretation|Funding)\s*:\s*/ig;
  const hits = [];
  let m;
  while ((m = re.exec(clean)) !== null) hits.push({ idx: m.index, label: m[1] });

  if (hits.length) {
    const parts = [];
    for (let i = 0; i < hits.length; i++) {
      const start        = hits[i].idx;
      const label        = hits[i].label;
      const end          = (i+1 < hits.length) ? hits[i+1].idx : clean.length;
      const colonPos     = clean.indexOf(":", start);
      const contentStart = colonPos >= 0 ? colonPos+1 : start;
      const content      = clean.slice(contentStart, end).trim();
      if (content) parts.push({ label, content });
    }
    return parts.map(s =>
      `<p><strong style="color:var(--navy);">${escapeHtml(s.label)}:</strong> ${escapeHtml(s.content)}</p>`
    ).join("");
  }

  const sentences = clean.split(/(?<=\.)\s+/).filter(Boolean);
  if (sentences.length <= 2) return `<p>${escapeHtml(clean)}</p>`;
  const out = [];
  let chunk = [];
  for (const s of sentences) {
    chunk.push(s);
    if (chunk.length >= 3) { out.push(chunk.join(" ")); chunk = []; }
  }
  if (chunk.length) out.push(chunk.join(" "));
  return out.map(p => `<p>${escapeHtml(p)}</p>`).join("");
}

function formatFullTextHtml(text) {
  const clean = stripHtml(text);
  if (!clean) return `<span style="color:var(--subtle);">(no full text returned)</span>`;
  const paras = clean.split(/\n{2,}|\.\s{2,}/g).map(x => x.trim()).filter(Boolean);
  if (paras.length <= 1) {
    const limited = clean.split(/(?<=\.)\s+/).filter(Boolean).slice(0, 120);
    return `<p>${escapeHtml(limited.join(" "))}</p>`;
  }
  const limited = paras.slice(0, 180);
  return limited.map(p => `<p>${escapeHtml(p)}</p>`).join("")
    + (paras.length > limited.length
      ? `<p style="color:var(--subtle);font-style:italic;font-size:12px;">(truncated for readability)</p>`
      : "");
}

async function enrichFromEuropePMC(p) {
  const doi   = normStr(p.doi);
  const pmid  = normStr(p.pmid);
  const title = normStr(p.title);

  async function epmcSearch(query) {
    const r = await fetchJson(
      `/external/search?q=${encodeURIComponent(query)}&source=europepmc&limit=5&cursor_mark=*`,
      { auth:false }
    );
    return (r?.items || [])[0] || null;
  }

  if (doi)   { const h = await epmcSearch(doi);   if (h) return h; }
  if (pmid)  { const h = await epmcSearch(pmid);  if (h) return h; }
  if (title) {
    const q = shortTitleKeywords(title);
    if (q) { const h = await epmcSearch(q); if (h) return h; }
  }
  return null;
}

async function ensureAbstractAndPMC(p) {
  const out = { ...p };
  const needAbstract = !hasUsefulAbstract(out);
  const needPMCID    = !normStr(out.pmcid);
  if (!needAbstract && !needPMCID) return out;
  try {
    const epmc = await enrichFromEuropePMC(out);
    if (epmc) {
      if (needAbstract && hasUsefulAbstract(epmc)) out.abstract = epmc.abstract;
      if (needPMCID    && normStr(epmc.pmcid))     out.pmcid    = epmc.pmcid;
      if (!normStr(out.pmid) && normStr(epmc.pmid)) out.pmid = epmc.pmid;
      if (!normStr(out.doi)  && normStr(epmc.doi))  out.doi  = epmc.doi;
      if (!normStr(out.url)  && normStr(epmc.url))  out.url  = epmc.url;
      const curAuthors = normalizeAuthors(out);
      const epAuthors  = normalizeAuthors(epmc);
      if (!curAuthors.length && epAuthors.length) out.authors = epAuthors;
    }
  } catch {}
  return out;
}

function renderAuthors(p) {
  const authors = normalizeAuthors(p);
  const card = qs("authorsCard");
  const box  = qs("authorsBox");
  if (!card || !box) return;
  if (!authors.length) { card.style.display = "none"; box.innerHTML = ""; return; }
  card.style.display = "";
  box.innerHTML = `<div>${escapeHtml(authors.join(", "))}</div>`;
}

const SOURCE_LABELS_PAPER = {
  europepmc: "Europe PMC", semantic_scholar: "Semantic Scholar",
  openalex: "OpenAlex", crossref: "Crossref",
};
const STUDY_TYPE_LABELS_PAPER = {
  rct: "RCT", meta_analysis: "Meta-analysis", systematic_review: "Systematic Review",
  observational: "Observational", cohort: "Cohort", case_control: "Case-Control",
  case_report: "Case Report", review: "Review", editorial: "Editorial", other: "Other",
};

function detectStudyTypePaper(p) {
  if (p.study_type) return p.study_type.toLowerCase().replace(/[\s-]/g, "_");
  const text = ((p.title || "") + " " + (p.abstract || "")).toLowerCase();
  if (/\brandom(is|iz)ed\b|\brct\b/.test(text))  return "rct";
  if (/\bmeta.?analy/.test(text))                   return "meta_analysis";
  if (/\bsystematic\s+review\b/.test(text))        return "systematic_review";
  if (/\bcohort\b/.test(text))                     return "cohort";
  if (/\bcase.control\b/.test(text))               return "case_control";
  if (/\bcase\s+report\b/.test(text))              return "case_report";
  if (/\breview\b/.test(text))                     return "review";
  if (/\beditorial\b/.test(text))                  return "editorial";
  if (/\bobservational\b/.test(text))              return "observational";
  return null;
}

function renderPaper(p) {
  qs("title").textContent = p.title || "(untitled)";

  const studyType = detectStudyTypePaper(p);
  const typeLabel = studyType ? (STUDY_TYPE_LABELS_PAPER[studyType] || studyType) : null;
  const isOA = !!normStr(p.pmcid);
  const srcLabel = SOURCE_LABELS_PAPER[p.source] || p.source || "";

  const badges = [
    p.year    ? `<span class="badge blue">${escapeHtml(String(p.year))}</span>` : "",
    p.venue   ? `<span class="badge" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p.venue)}</span>` : "",
    srcLabel  ? `<span class="badge coffee">${escapeHtml(srcLabel)}</span>` : "",
    typeLabel ? `<span class="badge green">${escapeHtml(typeLabel)}</span>` : "",
    isOA      ? `<span class="badge sage">Open Access</span>` : "",
    p.doi     ? `<span class="badge" style="font-family:monospace;font-size:10.5px;">DOI: ${escapeHtml(p.doi)}</span>` : "",
    p.pmid    ? `<span class="badge" style="font-size:10.5px;">PMID: ${escapeHtml(p.pmid)}</span>` : "",
    p.pmcid   ? `<span class="badge" style="font-size:10.5px;">PMC: ${escapeHtml(p.pmcid)}</span>` : "",
  ].filter(Boolean).join("");

  qs("meta").innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;">${badges}</div>`;
  qs("abstract").innerHTML = formatAbstractHtml(p.abstract || "");
  renderAuthors(p);

  const best = bestHumanLink(p);
  qs("openBtn").disabled = !best;
  qs("openBtn").onclick  = () => { if (best) window.open(best, "_blank"); };

  const prov  = providerUrl(p);
  const canOA = canLoadOAFullText(p);
  qs("loadFullBtn").disabled = !canOA;
  qs("openFullBtn").disabled = !prov;
  qs("openFullBtn").onclick  = () => { if (prov) window.open(prov, "_blank"); };

  qs("fullTextHint").innerHTML = canOA
    ? `Open Access full text available (PMCID detected). Load it inline below.`
    : `No PMCID detected — will try to find one via Europe PMC.`;
}

async function loadOAFullTextForPaper(p) {
  const pmcid = normStr(p.pmcid);
  if (!pmcid) { setFullText(`<span style="color:var(--subtle);">No PMCID available.</span>`); return; }
  setFullText(`<span style="color:var(--subtle);">Loading…</span>`);
  try {
    const r = await fetchJson(
      `/external/fulltext?source=europepmc&pmcid=${encodeURIComponent(pmcid)}`,
      { auth:false }
    );
    if (r && r.available === false) {
      setFullText(`<span style="color:var(--subtle);">${escapeHtml(r.message || "Full text not available.")}</span>`);
      return;
    }
    if (r && r.html) { setFullText(String(r.html)); return; }
    const text = (r && (r.text || r.full_text || "")) || "";
    if (!text) { setFullText(`<span style="color:var(--subtle);">No OA full text returned.</span>`); return; }
    setFullText(formatFullTextHtml(String(text)));
  } catch(e) {
    setFullText(`<span style="color:var(--bad);font-weight:600;">${escapeHtml(e.message)}</span>`);
    showToast("Full text failed", e.message, "error");
  }
}

qs("loadFullBtn").onclick = async () => {
  const p = savedStudy || external;
  if (!p) return;
  await withBtnLoading(qs("loadFullBtn"), () => loadOAFullTextForPaper(p), "Loading…");
};

async function fillSaveFolderPick() {
  if (!getToken()) return;
  try {
    const folders = await fetchJson("/folders");
    const sel = qs("saveFolderPick");
    if (!sel) return;
    sel.innerHTML = `<option value="">No folder</option>`;
    for (const f of folders) {
      const opt = document.createElement("option");
      opt.value = f.id;
      opt.textContent = f.name;
      sel.appendChild(opt);
    }
  } catch {}
}

function paperMatchByDoi(study, p) {
  const d1 = normStr(study?.doi).toLowerCase();
  const d2 = normStr(p?.doi).toLowerCase();
  return d1 && d2 && d1 === d2;
}

function paperMatchBySource(study, p) {
  const s1  = normStr(study?.source).toLowerCase();
  const s2  = normStr(p?.source).toLowerCase();
  const id1 = normStr(study?.source_id);
  const id2 = normStr(p?.source_id);
  return s1 && s2 && id1 && id2 && s1 === s2 && id1 === id2;
}

async function tryFindSavedInLibrary(p) {
  if (!getToken()) return null;
  try {
    const list = await fetchJson("/studies");
    if (!Array.isArray(list)) return null;
    return list.find(x => paperMatchByDoi(x, p)) || list.find(x => paperMatchBySource(x, p)) || null;
  } catch { return null; }
}

function markSavedUI(saved) {
  savedStudy = saved;
  sessionStorage.setItem("open_study_id", String(saved.id));
  sessionStorage.removeItem("last_external");
  setSaveMsg(`<span class="badge green">✓ Saved to library</span>`);
  qs("saveBtn").textContent = "Saved";
  qs("saveBtn").disabled = true;
}

function isProbablyNetworkError(e) {
  const msg = String(e?.message || "").toLowerCase();
  return msg.includes("failed to fetch") || msg.includes("networkerror")
    || msg.includes("load failed") || msg.includes("cors");
}

async function doSave() {
  if (__SAVE_IN_FLIGHT__) return;
  if (!requireAuthOrRedirect()) return;
  if (!external) return;
  __SAVE_IN_FLIGHT__ = true;
  setSaveMsg("");
  await withBtnLoading(qs("saveBtn"), async () => {
    try {
      const saved = await fetchJson("/external/import", { method:"POST", body: external });
      markSavedUI(saved);
      const folderId = qs("saveFolderPick")?.value || "";
      if (folderId) {
        await fetchJson(`/studies/${saved.id}`, { method:"PATCH", body:{ folder_id: parseInt(folderId,10) }});
      }
      showToast("Saved", "Added to your library.", "success");
    } catch(e) {
      if (isProbablyNetworkError(e) || e?.isNetwork) {
        setSaveMsg(`<span style="font-size:12px;color:var(--subtle);">Checking library…</span>`);
        const found = await tryFindSavedInLibrary(external);
        if (found) { markSavedUI(found); showToast("Saved", "Saved (network hiccup).", "success"); return; }
        setSaveMsg(`<span style="color:var(--bad);font-size:12.5px;">${escapeHtml(e.message)}</span>`);
        showToast("Save uncertain", "Could not confirm. Try refresh Library.", "error");
        return;
      }
      setSaveMsg(`<span style="color:var(--bad);font-size:12.5px;">${escapeHtml(e.message)}</span>`);
      showToast("Save failed", e.message, "error");
    }
  }, "Saving...");
  __SAVE_IN_FLIGHT__ = false;
}
qs("saveBtn").onclick = doSave;

function setActiveTab(tab) {
  document.querySelectorAll(".tabPill").forEach(x => x.classList.remove("active"));
  const el = document.querySelector(`.tabPill[data-tab="${tab}"]`);
  if (el) el.classList.add("active");
}

(function wireTabs() {
  const pills = document.querySelector(".tabPills");
  if (!pills || pills.dataset.wired === "1") return;
  pills.dataset.wired = "1";
  pills.addEventListener("click", (e) => {
    const pill = e.target.closest(".tabPill");
    if (!pill) return;
    const tab = pill.getAttribute("data-tab");
    if (tab === "thread")  return showThread(true);
    if (tab === "ai")      return showAI();
    if (tab === "related") return showRelated();
  });
})();

function isThreadShellPresent() {
  return !!(qs("commentList") && qs("commentBox") && qs("postBtn") && qs("threadHint"));
}

function renderThreadShell() {
  if (__THREAD_SHELL_READY__ && isThreadShellPresent()) return;
  __THREAD_SHELL_READY__ = false;

  setPanel(`
    <div style="font-size:11.5px;font-weight:700;color:var(--subtle);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;">Comments</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;" id="threadHint">Loading…</div>
    <div class="hr"></div>
    <div id="commentList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;"></div>
    <div class="hr"></div>
    <textarea id="commentBox" placeholder="Write a comment…" style="min-height:56px;font-size:13px;"></textarea>
    <div style="margin-top:8px;">
      <button type="button" class="btn primary" style="width:100%;" id="postBtn">Post Comment</button>
    </div>
    <div style="font-size:12px;min-height:16px;margin-top:6px;" id="threadMsg"></div>
  `);

  const panel = qs("panel");
  if (panel && panel.dataset.threadWired !== "1") {
    panel.dataset.threadWired = "1";
    panel.addEventListener("click", async (e) => {
      const del        = e.target.closest("[data-del]");
      const edit       = e.target.closest("[data-edit]");
      const saveEdit   = e.target.closest("[data-save-edit]");
      const cancelEdit = e.target.closest("[data-cancel-edit]");

      if (del) {
        const id = parseInt(del.getAttribute("data-del"), 10);
        const ok = await confirmModal({ title:"Delete comment?", message:"This will delete the comment (and its replies).", okText:"Delete", cancelText:"Cancel", danger:true });
        if (!ok) return;
        try { await fetchJson(`/comments/${id}`, { method:"DELETE" }); await showThread(true); }
        catch(err) { showToast("Delete failed", err.message, "error"); }
        return;
      }
      if (edit) {
        const id     = parseInt(edit.getAttribute("data-edit"), 10);
        const bodyEl = panel.querySelector(`[data-body="${id}"]`);
        if (!bodyEl) return;
        const cur = bodyEl.textContent || "";
        bodyEl.innerHTML = `
          <textarea id="editBox_${id}" style="font-size:13px;">${escapeHtml(cur)}</textarea>
          <div style="display:flex;gap:6px;margin-top:6px;">
            <button type="button" class="btn primary sm" data-save-edit="${id}">Save</button>
            <button type="button" class="btn sm" data-cancel-edit="${id}">Cancel</button>
          </div>`;
        return;
      }
      if (cancelEdit) { await showThread(true); return; }
      if (saveEdit) {
        const id     = parseInt(saveEdit.getAttribute("data-save-edit"), 10);
        const box    = qs(`editBox_${id}`);
        if (!box) return;
        const newBody = box.value.trim();
        if (!newBody) return;
        try { await fetchJson(`/comments/${id}`, { method:"PATCH", body:{ body:newBody }}); await showThread(true); }
        catch(err) { showToast("Edit failed", err.message, "error"); }
        return;
      }
    });
  }

  qs("postBtn").onclick = async () => {
    const body = qs("commentBox").value.trim();
    if (!body) return;
    await withBtnLoading(qs("postBtn"), async () => {
      try {
        if (!savedStudy) await ensureSavedStudy();
        await fetchJson(`/studies/${savedStudy.id}/comments`, { method:"POST", body:{ body }});
        qs("commentBox").value = "";
        await showThread(true);
      } catch(err) {
        qs("threadMsg").innerHTML = `<span style="color:var(--bad);font-size:12px;">${escapeHtml(err.message)}</span>`;
        showToast("Comment failed", err.message, "error");
      }
    }, "Posting...");
  };

  __THREAD_SHELL_READY__ = true;
}

function commentActionsHtml(canEdit, id) {
  if (!canEdit) return "";
  return `
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button type="button" class="btn sm ghost" data-edit="${id}">Edit</button>
      <button type="button" class="btn sm danger" data-del="${id}">Delete</button>
    </div>`;
}

function renderCommentList(comments) {
  const list  = qs("commentList");
  const panel = qs("panel");
  if (!list || !panel) return;

  const prevTop    = panel.scrollTop;
  const prevHeight = panel.scrollHeight;
  const wasNearBottom = (prevTop + panel.clientHeight) >= (prevHeight - 40);

  if (!comments || !comments.length) {
    list.innerHTML = `<div style="font-size:13px;color:var(--subtle);font-style:italic;padding:4px 0;">No comments yet.</div>`;
    requestAnimationFrame(() => { panel.scrollTop = prevTop; });
    return;
  }

  let html = "";
  for (const c of comments) {
    const canEdit = meUser && c.author === meUser.username;
    html += `
      <div style="background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;" data-cwrap="${c.id}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
          <b style="font-size:12.5px;color:var(--navy);">${escapeHtml(c.author)}</b>
          <span style="font-size:11px;color:var(--subtle);">${escapeHtml(new Date(c.created_at).toLocaleString())}</span>
        </div>
        <div style="font-size:13px;margin-top:6px;color:var(--text2);line-height:1.6;" data-body="${c.id}">${escapeHtml(c.body)}</div>
        ${commentActionsHtml(canEdit, c.id)}
        <div style="font-size:12px;min-height:14px;margin-top:4px;" data-msg="${c.id}"></div>
      </div>`;
  }
  list.innerHTML = html;

  requestAnimationFrame(() => {
    panel.scrollTop = wasNearBottom
      ? panel.scrollHeight
      : Math.max(0, prevTop + (panel.scrollHeight - prevHeight));
  });
}

async function showThread(force = false) {
  setActiveTab("thread");
  renderThreadShell();

  if (__THREAD_IN_FLIGHT__) return;
  __THREAD_IN_FLIGHT__ = true;

  try {
    if (!getToken()) {
      qs("threadHint").textContent = "Login required to view/post comments.";
      qs("commentList").innerHTML  = `<div style="font-size:13px;color:var(--subtle);">Login required.</div>`;
      qs("commentBox").disabled    = true;
      qs("postBtn").disabled       = true;
      return;
    }

    try { await ensureMe(); } catch {}

    if (!getToken()) {
      qs("threadHint").textContent = "Session expired. Please log in again.";
      qs("commentList").innerHTML  = `<a class="btn sm" href="login.html">Login</a>`;
      qs("commentBox").disabled    = true;
      qs("postBtn").disabled       = true;
      return;
    }

    qs("commentBox").disabled = false;
    qs("postBtn").disabled    = false;

    let s = savedStudy;
    if (!s && sessionStorage.getItem("open_study_id")) s = await ensureSavedStudy();

    qs("threadHint").textContent = s
      ? "Thread is active."
      : "Paper not saved yet. Posting will auto-save first.";

    const now      = Date.now();
    const canFetch = force || (now - __THREAD_LAST_FETCH_AT__ > THREAD_FETCH_THROTTLE_MS);
    if (!s)        { renderCommentList([]); return; }
    if (!canFetch) return;
    __THREAD_LAST_FETCH_AT__ = now;

    const comments = await fetchJson(`/studies/${s.id}/comments`);
    renderCommentList(comments);
  } catch(e) {
    qs("threadHint").textContent = "Failed to load comments.";
    qs("commentList").innerHTML  = `<div style="color:var(--bad);font-size:12.5px;">${escapeHtml(e.message)}</div>`;
  } finally {
    __THREAD_IN_FLIGHT__ = false;
  }
}

function _aiMsgHtml(msg) {
  const time = new Date(msg.ts).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });

  if (msg.role === "user") return `
    <div class="aiMsg aiMsg--user">
      <div>
        <div class="aiMsgBubble">${escapeHtml(msg.text)}</div>
        <div class="aiMsgMeta">${time}</div>
      </div>
    </div>`;

  if (msg.role === "error") return `
    <div class="aiMsg aiMsg--error">
      <div class="aiMsgBubble">⚠ ${escapeHtml(msg.text)}</div>
    </div>`;

  const html = escapeHtml(msg.text)
    .replace(/\*\*(.+?)\*\*/g,  '<strong>$1</strong>')
    .replace(/^### (.+)$/gm,    '<div class="aiHead">$1</div>')
    .replace(/^## (.+)$/gm,     '<div class="aiHead">$1</div>')
    .replace(/^\* (.+)$/gm,     '<div class="aiBullet">• $1</div>')
    .replace(/^- (.+)$/gm,      '<div class="aiBullet">• $1</div>')
    .replace(/\n/g, '<br>');

  return `
    <div class="aiMsg aiMsg--ai">
      <div class="aiMsgAvatar">S</div>
      <div class="aiMsgBody">
        <div class="aiMsgBubble">${html}</div>
        <div class="aiMsgMeta">${time}</div>
      </div>
    </div>`;
}

function _aiRender() {
  const feed = document.getElementById("aiFeed");
  if (!feed) return;
  if (!__AI_MESSAGES__.length) {
    feed.innerHTML = `<div class="aiEmpty">Summarize the paper or ask a question below.</div>`;
    return;
  }
  feed.innerHTML = __AI_MESSAGES__.map(_aiMsgHtml).join("");
  const wrap = document.getElementById("aiFeedWrap");
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function _aiPush(role, text) {
  __AI_MESSAGES__.push({ role, text, ts: Date.now() });
  _aiRender();
}

function _aiTyping(on) {
  const t    = document.getElementById("aiTyping");
  const wrap = document.getElementById("aiFeedWrap");
  if (t) t.style.display = on ? "flex" : "none";
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function _aiSetBusy(on) {
  ["aiSumBtn","aiAskBtn"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = on;
  });
  _aiTyping(on);
}

async function showAI() {
  __THREAD_SHELL_READY__ = false;
  setActiveTab("ai");

  if (!getToken()) {
    setPanel(`
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px;">Login required to use AI.</div>
      <a class="btn primary" href="login.html">Sign in</a>`);
    return;
  }

  const p = savedStudy || external;
  __AI_BASE__ = {
    title: p.title, abstract: p.abstract, venue: p.venue,
    year: p.year, pmid: p.pmid, pmcid: p.pmcid, doi: p.doi,
  };

  if (!__AI_WIRED__ || !document.getElementById("aiFeed")) {
    setPanel(`
      <div class="aiShell">
        <div class="aiFeedWrap" id="aiFeedWrap">
          <div class="aiFeed" id="aiFeed"></div>
          <div class="aiTyping" id="aiTyping" style="display:none;">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="aiInputRow">
          <textarea id="aiQBox" placeholder="Ask a question… (Ctrl+Enter to send)" rows="2"></textarea>
          <div class="aiActions">
            <button type="button" class="btn primary sm" id="aiSumBtn">Summarize</button>
            <button type="button" class="btn sm" id="aiAskBtn">Ask</button>
          </div>
        </div>
        <div class="aiFooter">Free AI included · <a href="ai.html">Add BYOK key</a> for your preferred model</div>
      </div>`);

    __AI_WIRED__ = true;
    _aiRender();

    document.getElementById("aiSumBtn").onclick = async () => {
      _aiSetBusy(true);
      try {
        const r = await fetchJson("/ai/summarize", { method:"POST", body: __AI_BASE__ });
        _aiPush("ai", r.text || "(no output)");
      } catch(e) {
        _aiPush("error", e.message);
        showToast("AI unavailable", e.message, "error");
      } finally {
        _aiSetBusy(false);
      }
    };

    document.getElementById("aiAskBtn").onclick = async () => {
      const box = document.getElementById("aiQBox");
      const q   = (box?.value || "").trim();
      if (!q) { showToast("Ask", "Type a question first.", "info"); return; }
      _aiPush("user", q);
      box.value = "";
      _aiSetBusy(true);
      try {
        const r = await fetchJson("/ai/ask", { method:"POST", body: { ...__AI_BASE__, question: q }});
        _aiPush("ai", r.text || "(no output)");
      } catch(e) {
        _aiPush("error", e.message);
        showToast("AI unavailable", e.message, "error");
      } finally {
        _aiSetBusy(false);
      }
    };

    document.getElementById("aiQBox").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        document.getElementById("aiAskBtn").click();
      }
    });

  } else {
    _aiRender();
  }
}

async function showRelated() {
  __THREAD_SHELL_READY__ = false;
  setActiveTab("related");

  const p = savedStudy || external;
  const q = shortTitleKeywords(p?.title || "");
  if (!q) { setPanel(`<div style="font-size:13px;color:var(--subtle);">No keywords available to find related papers.</div>`); return; }

  setPanel(`<div style="font-size:13px;color:var(--subtle);">Finding related papers…</div>`);

  try {
    const src = (p?.source || "europepmc");
    const r   = await fetchJson(
      `/external/search?q=${encodeURIComponent(q)}&source=${encodeURIComponent(src)}&limit=10&cursor_mark=*`,
      { auth:false }
    );
    const items = (r.items || [])
      .filter(x => x.source_id !== p.source_id)
      .sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0))
      .slice(0, 10);

    if (!items.length) { setPanel(`<div style="font-size:13px;color:var(--subtle);">No related results found for: <b>${escapeHtml(q)}</b></div>`); return; }

    let html = `<div style="font-size:11px;font-weight:700;color:var(--subtle);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;">Related · sorted by year</div>`;
    for (const it of items) {
      const relType = detectStudyTypePaper(it);
      const relTypeLabel = relType ? (STUDY_TYPE_LABELS_PAPER[relType] || relType) : null;
      const relOA = !!((it.pmcid || "").toString().trim());
      html += `
        <div style="background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .12s;" data-open-rel="1">
          <div style="font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--navy);line-height:1.4;margin-bottom:6px;">${escapeHtml(it.title)}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            ${it.year ? `<span class="badge blue">${escapeHtml(String(it.year))}</span>` : ""}
            <span class="badge coffee">${escapeHtml(SOURCE_LABELS_PAPER[it.source] || it.source)}</span>
            ${relTypeLabel ? `<span class="badge green">${escapeHtml(relTypeLabel)}</span>` : ""}
            ${relOA ? `<span class="badge sage">OA</span>` : ""}
          </div>
        </div>`;
    }
    setPanel(html);

    Array.from(qs("panel").querySelectorAll('[data-open-rel="1"]')).forEach((b, idx) => {
      b.onclick = () => {
        sessionStorage.setItem("last_external", JSON.stringify(items[idx]));
        sessionStorage.removeItem("open_study_id");
        location.href = "paper.html";
      };
    });
  } catch(e) {
    setPanel(`<div style="color:var(--bad);font-size:13px;">${escapeHtml(e.message)}</div>`);
    showToast("Related failed", e.message, "error");
  }
}

function setMode(mode) {
  qs("paperSplit").classList.toggle("drawerMode", mode === "drawer");
  qs("modeBtn").textContent = mode === "drawer" ? "⇄ Drawer" : "⇄ Side";
  sessionStorage.setItem("paper_panel_mode", mode);
}

qs("modeBtn").onclick  = () => {
  const cur = sessionStorage.getItem("paper_panel_mode") || "side";
  setMode(cur === "side" ? "drawer" : "side");
};
qs("closeBtn").onclick = () => {
  const split  = qs("paperSplit");
  const closed = split.classList.toggle("panelClosed");
  qs("closeBtn").textContent = closed ? "Open panel" : "✕";

  // If reopening, make sure panel right is visible
  if (!closed) {
    const right = document.querySelector(".paperRight");
    if (right) right.style.display = "";
  }
};

// Reopen button — shown when panel is closed
(function addReopenBtn() {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "btn sm ghost";
  btn.id = "reopenPanelBtn";
  btn.title = "Open panel";
  btn.style.cssText = `
    position: fixed; bottom: 24px; right: 24px;
    z-index: 1300; display: none;
    background: var(--navy); color: white;
    border: none; padding: 10px 16px;
    border-radius: 4px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    cursor: pointer;
  `;
  btn.textContent = "Open panel →";
  document.body.appendChild(btn);

  btn.onclick = () => {
    qs("paperSplit").classList.remove("panelClosed");
    qs("closeBtn").textContent = "✕";
    btn.style.display = "none";
  };

  // Watch for panel close state
  const observer = new MutationObserver(() => {
    const closed = qs("paperSplit")?.classList.contains("panelClosed");
    btn.style.display = closed ? "block" : "none";
  });
  const split = qs("paperSplit");
  if (split) observer.observe(split, { attributes: true, attributeFilter: ["class"] });
})();

(async function init() {
  const ref = getCurrentPaper();
  setMode(sessionStorage.getItem("paper_panel_mode") || "side");

  let p = null;

  if (ref.mode === "saved") {
    if (requireAuthOrRedirect()) {
      try {
        savedStudy = await fetchJson(`/studies/${ref.id}`);
        p = savedStudy;
        qs("saveBtn").textContent = "Saved";
        qs("saveBtn").disabled    = true;
        external = null;
      } catch(e) {
        sessionStorage.removeItem("open_study_id");
        savedStudy = null;
        const ext = sessionStorage.getItem("last_external");
        if (ext) {
          try { external = JSON.parse(ext); p = external; qs("saveBtn").disabled = !getToken(); }
          catch { sessionStorage.removeItem("last_external"); }
        }
        if (!p) {
          qs("title").textContent    = "Paper not found";
          qs("saveBtn").disabled     = true;
          qs("openBtn").disabled     = true;
          qs("loadFullBtn").disabled = true;
          qs("openFullBtn").disabled = true;
          await fillSaveFolderPick();
          setPanel(`<div style="font-size:13px;color:var(--subtle);">That saved paper no longer exists. Go back to Search or Library and open again.</div>`);
          return;
        }
      }
    }
  } else if (ref.mode === "external") {
    external = ref.paper;
    p = external;
    qs("saveBtn").disabled = !getToken();
  } else {
    qs("title").textContent    = "No paper selected";
    qs("saveBtn").disabled     = true;
    qs("openBtn").disabled     = true;
    qs("loadFullBtn").disabled = true;
    qs("openFullBtn").disabled = true;
    await fillSaveFolderPick();
    setPanel(`<div style="font-size:13px;color:var(--subtle);">Select a paper from Search or Library.</div>`);
    return;
  }

  renderPaper(p);

  const enriched = await ensureAbstractAndPMC(p);

  if (ref.mode === "external") {
    external = enriched;
    sessionStorage.setItem("last_external", JSON.stringify(external));
  } else if (ref.mode === "saved" && savedStudy) {
    savedStudy = { ...savedStudy, ...enriched };
  }

  renderPaper(enriched);
  qs("loadFullBtn").disabled = !canLoadOAFullText(enriched);
  await fillSaveFolderPick();
  showThread(true);
})();

} // end init guard
</script>
