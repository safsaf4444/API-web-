<!-- frontend/paper.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Paper - Medical Evidence</title>
  <link rel="stylesheet" href="styles.css"/>
</head>

<body class="appDark">
<header>
  <div class="headerInner">
    <div class="brand">Medical Evidence</div>
    <nav id="nav" class="navRow"></nav>
  </div>
</header>

<main class="split" id="paperSplit">
  <!-- LEFT -->
  <div class="paperLeft">
    <div class="card">
      <div class="paperTitle" id="title">(paper)</div>
      <div class="paperMetaLine" id="meta"></div>

      <div class="itemActions" style="margin-top:12px;">
        <button type="button" class="primary" id="saveBtn">Save to my library</button>
        <button type="button" id="openBtn">Open best link</button>
      </div>

      <div style="margin-top:10px;">
        <label>Save to folder</label>
        <select id="saveFolderPick" style="max-width:220px;">
          <option value="">No folder</option>
        </select>
      </div>
      <div class="small" id="saveMsg" style="margin-top:10px;"></div>
    </div>

    <div class="card" id="authorsCard" style="display:none;">
      <div class="sectionLabel">AUTHORS</div>
      <div class="hr"></div>
      <div class="prose" id="authorsBox"></div>
    </div>

    <div class="card">
      <div class="sectionLabel">ABSTRACT</div>
      <div class="hr"></div>
      <div class="abstractBox">
        <div class="prose" id="abstract">(abstract)</div>
      </div>
    </div>

    <div class="card">
      <div class="sectionLabel">FULL TEXT (OPEN ACCESS)</div>
      <div class="hr"></div>
      <div class="small" id="fullTextHint">
        If the paper has an Open Access full text (usually via PMCID in Europe PMC), you can load it here.
      </div>
      <div class="itemActions" style="margin-top:12px;">
        <button type="button" class="primary" id="loadFullBtn">Load full text (OA)</button>
        <button type="button" id="openFullBtn">Open provider page</button>
      </div>
      <div class="hr" style="margin-top:12px;"></div>
      <div class="prose" id="fullTextBox" style="max-height:520px;overflow:auto;">
        <div class="small">(not loaded)</div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="paperRight">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <h3 style="margin:0;">PANELS</h3>
        <div style="display:flex;gap:10px;">
          <button type="button" id="modeBtn">Mode: Side</button>
          <button type="button" id="closeBtn">Close</button>
        </div>
      </div>

      <div class="tabPills" style="margin-top:12px;">
        <div class="tabPill active" data-tab="thread">Thread</div>
        <div class="tabPill" data-tab="ai">AI</div>
        <div class="tabPill" data-tab="related">Related</div>
      </div>

      <div class="panelBody" id="panel"></div>
    </div>
  </div>
</main>

<script src="api.js"></script>
<script src="app.js"></script>

<script>
if (window.__ME_PAPER_INIT__) {
  // already initialised — do nothing
} else {
window.__ME_PAPER_INIT__ = true;

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let external    = null;
let savedStudy  = null;
let meUser      = null;

let __SAVE_IN_FLIGHT__       = false;
let __THREAD_IN_FLIGHT__     = false;
let __THREAD_LAST_FETCH_AT__ = 0;
const THREAD_FETCH_THROTTLE_MS = 700;
let __THREAD_SHELL_READY__   = false;

/* AI chat state — lives outside showAI so tab switches preserve history */
let __AI_MESSAGES__ = [];
let __AI_BASE__     = null;
let __AI_WIRED__    = false;

/* ═══════════════════════════════════════════
   DOM HELPERS
═══════════════════════════════════════════ */
function setSaveMsg(html) { qs("saveMsg").innerHTML = html || ""; }
function setPanel(html)   { qs("panel").innerHTML   = html || ""; }
function setFullText(html){ qs("fullTextBox").innerHTML = html || ""; }

/* ═══════════════════════════════════════════
   PAPER SELECTION
═══════════════════════════════════════════ */
function getCurrentPaper() {
  const ext = sessionStorage.getItem("last_external");
  if (ext) {
    try { return { mode:"external", paper: JSON.parse(ext) }; }
    catch { sessionStorage.removeItem("last_external"); }
  }
  const id = sessionStorage.getItem("open_study_id");
  if (id) return { mode:"saved", id: parseInt(id, 10) };
  return { mode:"none" };
}

async function ensureMe() {
  if (!getToken()) return null;
  if (meUser) return meUser;
  try { meUser = await fetchJson("/me"); } catch { meUser = null; }
  return meUser;
}

async function ensureSavedStudy() {
  if (savedStudy) return savedStudy;
  const id = sessionStorage.getItem("open_study_id");
  if (id && getToken()) {
    try {
      savedStudy = await fetchJson(`/studies/${parseInt(id,10)}`);
      return savedStudy;
    } catch {
      sessionStorage.removeItem("open_study_id");
      savedStudy = null;
    }
  }
  if (external && getToken()) {
    const saved = await fetchJson("/external/import", { method:"POST", body: external });
    savedStudy = saved;
    sessionStorage.setItem("open_study_id", String(saved.id));
    sessionStorage.removeItem("last_external");
    qs("saveBtn").textContent = "Saved";
    qs("saveBtn").disabled = true;
    setSaveMsg(`<span class="badge green">Saved</span>`);
    return savedStudy;
  }
  return null;
}

/* ═══════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════ */
function normStr(x) { return (x || "").toString().trim(); }

function stripHtml(s) {
  return (s || "")
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function shortTitleKeywords(title) {
  const stop = new Set(["the","and","or","of","to","in","for","a","an","with","on","by","from","at","as","is","are"]);
  return (title || "")
    .toLowerCase()
    .replace(/[^a-z0-9\s-]/g, " ")
    .split(/\s+/)
    .filter(w => w.length >= 4 && !stop.has(w))
    .slice(0, 8)
    .join(" ");
}

function hasUsefulAbstract(p) {
  const a = stripHtml(p?.abstract || "");
  return a && a.length >= 60;
}

function normalizeAuthors(p) {
  if (!p) return [];
  const a = p.authors;
  if (!a) return [];
  if (Array.isArray(a)) return a.map(x => (x ?? "").toString().trim()).filter(Boolean);
  if (typeof a === "string") return a.split(",").map(x => x.trim()).filter(Boolean);
  return [];
}

/* ═══════════════════════════════════════════
   LINK HELPERS
═══════════════════════════════════════════ */
function looksLikeApiUrl(u) {
  if (!u) return false;
  const s = String(u).toLowerCase();
  return s.startsWith("https://api.") || s.startsWith("http://api.")
    || s.includes("api.elsevier.com") || s.includes("/content/")
    || s.endsWith(".xml") || s.includes(".xml?") || s.endsWith("/xml");
}

function doiUrl(p) {
  const doi = normStr(p?.doi);
  return doi ? `https://doi.org/${encodeURIComponent(doi)}` : "";
}

function providerUrl(p) {
  if (p && p.url && !looksLikeApiUrl(p.url)) return p.url;
  const src   = (p.source || "").toLowerCase();
  const pmcid = normStr(p.pmcid);
  const pmid  = normStr(p.pmid);
  const doi   = normStr(p.doi);
  if (src === "europepmc") {
    if (pmcid) return `https://europepmc.org/article/PMC/${encodeURIComponent(pmcid)}`;
    if (pmid)  return `https://europepmc.org/article/MED/${encodeURIComponent(pmid)}`;
    if (doi)   return `https://europepmc.org/article/DOI/${encodeURIComponent(doi)}`;
  }
  if (doi) return `https://doi.org/${encodeURIComponent(doi)}`;
  return "";
}

function bestHumanLink(p) {
  const d = doiUrl(p);
  if (d) return d;
  const u = providerUrl(p);
  return (u && !looksLikeApiUrl(u)) ? u : "";
}

function canLoadOAFullText(p) { return !!normStr(p?.pmcid); }

/* ═══════════════════════════════════════════
   FORMATTING
═══════════════════════════════════════════ */
function formatAbstractHtml(raw) {
  const clean = stripHtml(raw);
  if (!clean) return `<div class="small">(no abstract)</div>`;

  const re = /(Background|Objective|Objectives|Methods|Method|Design|Participants|Interventions|Main outcome measures|Results|Conclusion|Conclusions|Discussion|Interpretation|Funding)\s*:\s*/ig;
  const hits = [];
  let m;
  while ((m = re.exec(clean)) !== null) hits.push({ idx: m.index, label: m[1] });

  if (hits.length) {
    const parts = [];
    for (let i = 0; i < hits.length; i++) {
      const start      = hits[i].idx;
      const label      = hits[i].label;
      const end        = (i+1 < hits.length) ? hits[i+1].idx : clean.length;
      const colonPos   = clean.indexOf(":", start);
      const contentStart = colonPos >= 0 ? colonPos+1 : start;
      const content    = clean.slice(contentStart, end).trim();
      if (content) parts.push({ label, content });
    }
    return parts.map(s => `
      <div style="margin:10px 0;">
        <div style="font-weight:900;">${escapeHtml(s.label)}:</div>
        <div>${escapeHtml(s.content)}</div>
      </div>`).join("");
  }

  const sentences = clean.split(/(?<=\.)\s+/).filter(Boolean);
  if (sentences.length <= 2) return `<div>${escapeHtml(clean)}</div>`;
  const out = [];
  let chunk = [];
  for (const s of sentences) {
    chunk.push(s);
    if (chunk.length >= 3) { out.push(chunk.join(" ")); chunk = []; }
  }
  if (chunk.length) out.push(chunk.join(" "));
  return out.map(p => `<p>${escapeHtml(p)}</p>`).join("");
}

function formatFullTextHtml(text) {
  const clean = stripHtml(text);
  if (!clean) return `<div class="small">(no full text returned)</div>`;
  const paras = clean.split(/\n{2,}|\.\s{2,}/g).map(x => x.trim()).filter(Boolean);
  if (paras.length <= 1) {
    const limited = clean.split(/(?<=\.)\s+/).filter(Boolean).slice(0, 120);
    return `<p>${escapeHtml(limited.join(" "))}</p>`;
  }
  const limited = paras.slice(0, 180);
  return limited.map(p => `<p>${escapeHtml(p)}</p>`).join("")
    + (paras.length > limited.length ? `<div class="small" style="opacity:.8;">(truncated for readability)</div>` : "");
}

/* ═══════════════════════════════════════════
   ENRICHMENT
═══════════════════════════════════════════ */
async function enrichFromEuropePMC(p) {
  const doi   = normStr(p.doi);
  const pmid  = normStr(p.pmid);
  const title = normStr(p.title);

  async function epmcSearch(query) {
    const r = await fetchJson(
      `/external/search?q=${encodeURIComponent(query)}&source=europepmc&limit=5&cursor_mark=*`,
      { auth:false }
    );
    return (r?.items || [])[0] || null;
  }

  if (doi)   { const h = await epmcSearch(doi);   if (h) return h; }
  if (pmid)  { const h = await epmcSearch(pmid);  if (h) return h; }
  if (title) {
    const q = shortTitleKeywords(title);
    if (q) { const h = await epmcSearch(q); if (h) return h; }
  }
  return null;
}

async function ensureAbstractAndPMC(p) {
  const out = { ...p };
  const needAbstract = !hasUsefulAbstract(out);
  const needPMCID    = !normStr(out.pmcid);
  if (!needAbstract && !needPMCID) return out;
  try {
    const epmc = await enrichFromEuropePMC(out);
    if (epmc) {
      if (needAbstract && hasUsefulAbstract(epmc)) out.abstract = epmc.abstract;
      if (needPMCID    && normStr(epmc.pmcid))     out.pmcid    = epmc.pmcid;
      if (!normStr(out.pmid) && normStr(epmc.pmid)) out.pmid = epmc.pmid;
      if (!normStr(out.doi)  && normStr(epmc.doi))  out.doi  = epmc.doi;
      if (!normStr(out.url)  && normStr(epmc.url))  out.url  = epmc.url;
      const curAuthors = normalizeAuthors(out);
      const epAuthors  = normalizeAuthors(epmc);
      if (!curAuthors.length && epAuthors.length) out.authors = epAuthors;
    }
  } catch {}
  return out;
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function renderAuthors(p) {
  const authors = normalizeAuthors(p);
  const card = qs("authorsCard");
  const box  = qs("authorsBox");
  if (!card || !box) return;
  if (!authors.length) { card.style.display = "none"; box.innerHTML = ""; return; }
  card.style.display = "";
  box.innerHTML = `<div>${escapeHtml(authors.join(", "))}</div>`;
}

function renderPaper(p) {
  qs("title").textContent = (p.title || "(untitled)").toUpperCase();

  const authors     = normalizeAuthors(p);
  const authorsMeta = authors.length
    ? `authors: ${authors.slice(0,8).join(", ")}${authors.length>8 ? "…" : ""}`
    : null;

  const meta = [
    p.year      ? `year: ${p.year}`           : null,
    p.venue     ? `venue: ${p.venue}`         : null,
    authorsMeta,
    p.source    ? `source: ${p.source}`       : null,
    p.source_id ? `source_id: ${p.source_id}` : null,
    `pmcid: ${p.pmcid || "n/a"}`,
    `pmid: ${p.pmid   || "n/a"}`,
    `doi: ${p.doi     || "n/a"}`
  ].filter(Boolean).join(" • ");

  qs("meta").textContent = meta;
  qs("abstract").innerHTML = formatAbstractHtml(p.abstract || "");
  renderAuthors(p);

  const best = bestHumanLink(p);
  qs("openBtn").disabled = !best;
  qs("openBtn").onclick  = () => { if (best) window.open(best, "_blank"); };

  const prov  = providerUrl(p);
  const canOA = canLoadOAFullText(p);
  qs("loadFullBtn").disabled = !canOA;
  qs("openFullBtn").disabled = !prov;
  qs("openFullBtn").onclick  = () => { if (prov) window.open(prov, "_blank"); };

  qs("fullTextHint").innerHTML = canOA
    ? `<span class="small">Open Access full text may be available (PMCID detected). You can load it inline.</span>`
    : `<span class="small">No PMCID detected yet. We'll try to find one automatically (via Europe PMC) for inline OA full text.</span>`;
}

/* ═══════════════════════════════════════════
   FULL TEXT
═══════════════════════════════════════════ */
async function loadOAFullTextForPaper(p) {
  const pmcid = normStr(p.pmcid);
  if (!pmcid) { setFullText(`<div class="small">No PMCID available.</div>`); return; }
  setFullText(`<div class="small">Loading…</div>`);
  try {
    const r = await fetchJson(
      `/external/fulltext?source=europepmc&pmcid=${encodeURIComponent(pmcid)}`,
      { auth:false }
    );
    if (r && r.available === false) {
      setFullText(`<div class="small">${escapeHtml(r.message || "Full text not available.")}</div>`);
      return;
    }
    if (r && r.html) { setFullText(String(r.html)); return; }
    const text = (r && (r.text || r.full_text || "")) || "";
    if (!text) { setFullText(`<div class="small">No OA full text returned.</div>`); return; }
    setFullText(formatFullTextHtml(String(text)));
  } catch(e) {
    setFullText(`<div class="small" style="color:var(--bad);font-weight:900;">${escapeHtml(e.message)}</div>`);
    showToast("Full text failed", e.message, "error");
  }
}

qs("loadFullBtn").onclick = async () => {
  const p = savedStudy || external;
  if (!p) return;
  await withBtnLoading(qs("loadFullBtn"), () => loadOAFullTextForPaper(p), "Loading…");
};

/* ═══════════════════════════════════════════
   SAVE
═══════════════════════════════════════════ */
async function fillSaveFolderPick() {
  if (!getToken()) return;
  try {
    const folders = await fetchJson("/folders");
    const sel = qs("saveFolderPick");
    if (!sel) return;
    sel.innerHTML = `<option value="">No folder</option>`;
    for (const f of folders) {
      const opt = document.createElement("option");
      opt.value = f.id;
      opt.textContent = f.name;
      sel.appendChild(opt);
    }
  } catch {}
}

function paperMatchByDoi(study, p) {
  const d1 = normStr(study?.doi).toLowerCase();
  const d2 = normStr(p?.doi).toLowerCase();
  return d1 && d2 && d1 === d2;
}

function paperMatchBySource(study, p) {
  const s1  = normStr(study?.source).toLowerCase();
  const s2  = normStr(p?.source).toLowerCase();
  const id1 = normStr(study?.source_id);
  const id2 = normStr(p?.source_id);
  return s1 && s2 && id1 && id2 && s1 === s2 && id1 === id2;
}

async function tryFindSavedInLibrary(p) {
  if (!getToken()) return null;
  try {
    const list = await fetchJson("/studies");
    if (!Array.isArray(list)) return null;
    return list.find(x => paperMatchByDoi(x, p)) || list.find(x => paperMatchBySource(x, p)) || null;
  } catch { return null; }
}

function markSavedUI(saved) {
  savedStudy = saved;
  sessionStorage.setItem("open_study_id", String(saved.id));
  sessionStorage.removeItem("last_external");
  setSaveMsg(`<span class="badge green">Saved</span>`);
  qs("saveBtn").textContent = "Saved";
  qs("saveBtn").disabled = true;
}

function isProbablyNetworkError(e) {
  const msg = String(e?.message || "").toLowerCase();
  return msg.includes("failed to fetch") || msg.includes("networkerror")
    || msg.includes("load failed") || msg.includes("cors");
}

async function doSave() {
  if (__SAVE_IN_FLIGHT__) return;
  if (!requireAuthOrRedirect()) return;
  if (!external) return;
  __SAVE_IN_FLIGHT__ = true;
  setSaveMsg("");
  await withBtnLoading(qs("saveBtn"), async () => {
    try {
      const saved = await fetchJson("/external/import", { method:"POST", body: external });
      markSavedUI(saved);
      const folderId = qs("saveFolderPick")?.value || "";
      if (folderId) {
        await fetchJson(`/studies/${saved.id}`, { method:"PATCH", body:{ folder_id: parseInt(folderId,10) }});
      }
      showToast("Saved", "Added to your library.", "success");
    } catch(e) {
      if (isProbablyNetworkError(e) || e?.isNetwork) {
        setSaveMsg(`<span class="small">Checking library…</span>`);
        const found = await tryFindSavedInLibrary(external);
        if (found) { markSavedUI(found); showToast("Saved", "Saved (network hiccup).", "success"); return; }
        setSaveMsg(`<span style="color:var(--bad);font-weight:900;">${escapeHtml(e.message)}</span>`);
        showToast("Save uncertain", "Could not confirm. Try refresh Library.", "error");
        return;
      }
      setSaveMsg(`<span style="color:var(--bad);font-weight:900;">${escapeHtml(e.message)}</span>`);
      showToast("Save failed", e.message, "error");
    }
  }, "Saving...");
  __SAVE_IN_FLIGHT__ = false;
}
qs("saveBtn").onclick = doSave;

/* ═══════════════════════════════════════════
   TABS
═══════════════════════════════════════════ */
function setActiveTab(tab) {
  document.querySelectorAll(".tabPill").forEach(x => x.classList.remove("active"));
  const el = document.querySelector(`.tabPill[data-tab="${tab}"]`);
  if (el) el.classList.add("active");
}

(function wireTabs() {
  const pills = document.querySelector(".tabPills");
  if (!pills || pills.dataset.wired === "1") return;
  pills.dataset.wired = "1";
  pills.addEventListener("click", (e) => {
    const pill = e.target.closest(".tabPill");
    if (!pill) return;
    const tab = pill.getAttribute("data-tab");
    if (tab === "thread")  return showThread(true);
    if (tab === "ai")      return showAI();
    if (tab === "related") return showRelated();
  });
})();

/* ═══════════════════════════════════════════
   THREAD
═══════════════════════════════════════════ */
function isThreadShellPresent() {
  return !!(qs("commentList") && qs("commentBox") && qs("postBtn") && qs("threadHint"));
}

function renderThreadShell() {
  if (__THREAD_SHELL_READY__ && isThreadShellPresent()) return;
  __THREAD_SHELL_READY__ = false;

  setPanel(`
    <div class="small" style="font-weight:900;">Comments</div>
    <div class="small" id="threadHint">Loading…</div>
    <div class="hr"></div>
    <div class="list" id="commentList"><div class="item small">Loading…</div></div>
    <div class="hr"></div>
    <textarea id="commentBox" placeholder="Write a comment..."></textarea>
    <div style="margin-top:10px;">
      <button type="button" class="primary fullWidthBtn" id="postBtn">Post Comment</button>
    </div>
    <div class="small" id="threadMsg" style="margin-top:8px;"></div>
  `);

  const panel = qs("panel");
  if (panel && panel.dataset.threadWired !== "1") {
    panel.dataset.threadWired = "1";
    panel.addEventListener("click", async (e) => {
      const del        = e.target.closest("[data-del]");
      const edit       = e.target.closest("[data-edit]");
      const saveEdit   = e.target.closest("[data-save-edit]");
      const cancelEdit = e.target.closest("[data-cancel-edit]");

      if (del) {
        const id = parseInt(del.getAttribute("data-del"), 10);
        const ok = await confirmModal({ title:"Delete comment?", message:"This will delete the comment (and its replies).", okText:"Delete", cancelText:"Cancel", danger:true });
        if (!ok) return;
        try { await fetchJson(`/comments/${id}`, { method:"DELETE" }); await showThread(true); }
        catch(err) { showToast("Delete failed", err.message, "error"); }
        return;
      }
      if (edit) {
        const id     = parseInt(edit.getAttribute("data-edit"), 10);
        const bodyEl = panel.querySelector(`[data-body="${id}"]`);
        if (!bodyEl) return;
        const cur = bodyEl.textContent || "";
        bodyEl.innerHTML = `
          <textarea id="editBox_${id}">${escapeHtml(cur)}</textarea>
          <div class="itemActions" style="margin-top:10px;">
            <button type="button" class="btn primary" data-save-edit="${id}">Save</button>
            <button type="button" class="btn" data-cancel-edit="${id}">Cancel</button>
          </div>`;
        return;
      }
      if (cancelEdit) { await showThread(true); return; }
      if (saveEdit) {
        const id     = parseInt(saveEdit.getAttribute("data-save-edit"), 10);
        const box    = qs(`editBox_${id}`);
        if (!box) return;
        const newBody = box.value.trim();
        if (!newBody) return;
        try { await fetchJson(`/comments/${id}`, { method:"PATCH", body:{ body:newBody }}); await showThread(true); }
        catch(err) { showToast("Edit failed", err.message, "error"); }
        return;
      }
    });
  }

  qs("postBtn").onclick = async () => {
    const body = qs("commentBox").value.trim();
    if (!body) return;
    await withBtnLoading(qs("postBtn"), async () => {
      try {
        if (!savedStudy) await ensureSavedStudy();
        await fetchJson(`/studies/${savedStudy.id}/comments`, { method:"POST", body:{ body }});
        qs("commentBox").value = "";
        await showThread(true);
      } catch(err) {
        qs("threadMsg").innerHTML = `<span style="color:var(--bad);font-weight:900;">${escapeHtml(err.message)}</span>`;
        showToast("Comment failed", err.message, "error");
      }
    }, "Posting...");
  };

  __THREAD_SHELL_READY__ = true;
}

function commentActionsHtml(canEdit, id) {
  if (!canEdit) return "";
  return `
    <div class="itemActions" style="margin-top:10px;">
      <button type="button" class="btn" data-edit="${id}">Edit</button>
      <button type="button" class="btn danger" data-del="${id}">Delete</button>
    </div>`;
}

function renderCommentList(comments) {
  const list  = qs("commentList");
  const panel = qs("panel");
  if (!list || !panel) return;

  const prevTop    = panel.scrollTop;
  const prevHeight = panel.scrollHeight;
  const wasNearBottom = (prevTop + panel.clientHeight) >= (prevHeight - 40);

  if (!comments || !comments.length) {
    list.innerHTML = `<div class="item small">No comments yet.</div>`;
    requestAnimationFrame(() => { panel.scrollTop = prevTop; });
    return;
  }

  let html = "";
  for (const c of comments) {
    const canEdit = meUser && c.author === meUser.username;
    html += `
      <div class="item" data-cwrap="${c.id}">
        <div><b>${escapeHtml(c.author)}</b> <span class="small">${escapeHtml(new Date(c.created_at).toLocaleString())}</span></div>
        <div class="small" style="margin-top:6px;color:var(--text);" data-body="${c.id}">${escapeHtml(c.body)}</div>
        ${commentActionsHtml(canEdit, c.id)}
        <div class="small" data-msg="${c.id}" style="margin-top:8px;"></div>
      </div>`;
  }
  list.innerHTML = html;

  requestAnimationFrame(() => {
    panel.scrollTop = wasNearBottom
      ? panel.scrollHeight
      : Math.max(0, prevTop + (panel.scrollHeight - prevHeight));
  });
}

async function showThread(force = false) {
  setActiveTab("thread");
  renderThreadShell();

  if (__THREAD_IN_FLIGHT__) return;
  __THREAD_IN_FLIGHT__ = true;

  try {
    if (!getToken()) {
      qs("threadHint").textContent = "Login required to view/post comments.";
      qs("commentList").innerHTML  = `<div class="item small">Login required.</div>`;
      qs("commentBox").disabled    = true;
      qs("postBtn").disabled       = true;
      return;
    }

    try { await ensureMe(); } catch {}

    if (!getToken()) {
      qs("threadHint").textContent = "Session expired. Please log in again.";
      qs("commentList").innerHTML  = `<div class="item small"><a class="btn" href="login.html">Login</a></div>`;
      qs("commentBox").disabled    = true;
      qs("postBtn").disabled       = true;
      return;
    }

    qs("commentBox").disabled = false;
    qs("postBtn").disabled    = false;

    let s = savedStudy;
    if (!s && sessionStorage.getItem("open_study_id")) s = await ensureSavedStudy();

    qs("threadHint").textContent = s
      ? "Thread is active."
      : "This paper is not saved yet. Posting will auto-save first.";

    const now      = Date.now();
    const canFetch = force || (now - __THREAD_LAST_FETCH_AT__ > THREAD_FETCH_THROTTLE_MS);
    if (!s)         { renderCommentList([]); return; }
    if (!canFetch)  return;
    __THREAD_LAST_FETCH_AT__ = now;

    const comments = await fetchJson(`/studies/${s.id}/comments`);
    renderCommentList(comments);
  } catch(e) {
    qs("threadHint").textContent = "Failed to load comments.";
    qs("commentList").innerHTML  = `<div class="item small" style="color:var(--bad);font-weight:900;">${escapeHtml(e.message)}</div>`;
  } finally {
    __THREAD_IN_FLIGHT__ = false;
  }
}

/* ═══════════════════════════════════════════
   AI CHAT
═══════════════════════════════════════════ */
function _aiMsgHtml(msg) {
  const time = new Date(msg.ts).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });

  if (msg.role === "user") return `
    <div class="aiMsg aiMsg--user">
      <div>
        <div class="aiMsgBubble">${escapeHtml(msg.text)}</div>
        <div class="aiMsgMeta">${time}</div>
      </div>
    </div>`;

  if (msg.role === "error") return `
    <div class="aiMsg aiMsg--error">
      <div class="aiMsgBubble">⚠ ${escapeHtml(msg.text)}</div>
    </div>`;

  // AI response — markdown-lite
  const html = escapeHtml(msg.text)
    .replace(/\*\*(.+?)\*\*/g,  '<strong>$1</strong>')
    .replace(/^### (.+)$/gm,    '<div class="aiHead">$1</div>')
    .replace(/^## (.+)$/gm,     '<div class="aiHead">$1</div>')
    .replace(/^\* (.+)$/gm,     '<div class="aiBullet">• $1</div>')
    .replace(/^- (.+)$/gm,      '<div class="aiBullet">• $1</div>')
    .replace(/\n/g, '<br>');

  return `
    <div class="aiMsg aiMsg--ai">
      <div class="aiMsgAvatar">AI</div>
      <div class="aiMsgBody">
        <div class="aiMsgBubble">${html}</div>
        <div class="aiMsgMeta">${time}</div>
      </div>
    </div>`;
}

function _aiRender() {
  const feed = document.getElementById("aiFeed");
  if (!feed) return;
  if (!__AI_MESSAGES__.length) {
    feed.innerHTML = `<div class="aiEmpty">Summarize the paper or ask a question below.</div>`;
    return;
  }
  feed.innerHTML = __AI_MESSAGES__.map(_aiMsgHtml).join("");
  const wrap = document.getElementById("aiFeedWrap");
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function _aiPush(role, text) {
  __AI_MESSAGES__.push({ role, text, ts: Date.now() });
  _aiRender();
}

function _aiTyping(on) {
  const t    = document.getElementById("aiTyping");
  const wrap = document.getElementById("aiFeedWrap");
  if (t) t.style.display = on ? "flex" : "none";
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function _aiSetBusy(on) {
  ["aiSumBtn","aiAskBtn"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = on;
  });
  _aiTyping(on);
}

async function showAI() {
  __THREAD_SHELL_READY__ = false;
  setActiveTab("ai");

  if (!getToken()) {
    setPanel(`
      <div class="small">Login required to use AI.</div>
      <div class="hr"></div>
      <a class="btn" href="login.html">Login</a>`);
    return;
  }

  const p = savedStudy || external;
  __AI_BASE__ = {
    title: p.title, abstract: p.abstract, venue: p.venue,
    year: p.year, pmid: p.pmid, pmcid: p.pmcid, doi: p.doi,
  };

  /* Only build shell once — tab switches preserve history */
  if (!__AI_WIRED__ || !document.getElementById("aiFeed")) {
    setPanel(`
      <div class="aiShell">
        <div class="aiFeedWrap" id="aiFeedWrap">
          <div class="aiFeed" id="aiFeed"></div>
          <div class="aiTyping" id="aiTyping" style="display:none;">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="aiInputRow">
          <textarea id="aiQBox" placeholder="Ask a question… (Ctrl+Enter to send)" rows="2"></textarea>
          <div class="aiActions">
            <button type="button" class="primary" id="aiSumBtn">Summarize</button>
            <button type="button" id="aiAskBtn">Ask</button>
          </div>
        </div>
        <div class="aiFooter">Free AI included · <a href="ai.html">Add BYOK key</a> for your preferred model</div>
      </div>`);

    __AI_WIRED__ = true;
    _aiRender();

    document.getElementById("aiSumBtn").onclick = async () => {
      _aiSetBusy(true);
      try {
        const r = await fetchJson("/ai/summarize", { method:"POST", body: __AI_BASE__ });
        _aiPush("ai", r.text || "(no output)");
      } catch(e) {
        _aiPush("error", e.message);
        showToast("AI unavailable", e.message, "error");
      } finally {
        _aiSetBusy(false);
      }
    };

    document.getElementById("aiAskBtn").onclick = async () => {
      const box = document.getElementById("aiQBox");
      const q   = (box?.value || "").trim();
      if (!q) { showToast("Ask", "Type a question first.", "info"); return; }
      _aiPush("user", q);
      box.value = "";
      _aiSetBusy(true);
      try {
        const r = await fetchJson("/ai/ask", { method:"POST", body: { ...__AI_BASE__, question: q }});
        _aiPush("ai", r.text || "(no output)");
      } catch(e) {
        _aiPush("error", e.message);
        showToast("AI unavailable", e.message, "error");
      } finally {
        _aiSetBusy(false);
      }
    };

    document.getElementById("aiQBox").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        document.getElementById("aiAskBtn").click();
      }
    });

  } else {
    /* Tab switched back — re-render messages only, shell preserved */
    _aiRender();
  }
}

/* ═══════════════════════════════════════════
   RELATED
═══════════════════════════════════════════ */
async function showRelated() {
  __THREAD_SHELL_READY__ = false;
  setActiveTab("related");

  const p = savedStudy || external;
  const q = shortTitleKeywords(p?.title || "");
  if (!q) { setPanel(`<div class="small">No keywords available to find related papers.</div>`); return; }

  setPanel(`<div class="small">Finding related papers…</div>`);

  try {
    const src = (p?.source || "europepmc");
    const r   = await fetchJson(
      `/external/search?q=${encodeURIComponent(q)}&source=${encodeURIComponent(src)}&limit=10&cursor_mark=*`,
      { auth:false }
    );
    const items = (r.items || []).filter(x => x.source_id !== p.source_id).slice(0, 10);

    if (!items.length) { setPanel(`<div class="small">No related results found for: <b>${escapeHtml(q)}</b></div>`); return; }

    let html = `<div class="small">Related results for: <b>${escapeHtml(q)}</b></div><div class="hr"></div><div class="list">`;
    for (const it of items) {
      html += `
        <div class="item">
          <div class="itemTitle">${escapeHtml(it.title)}</div>
          <div class="itemMeta">
            ${it.year ? `<span class="badge">${escapeHtml(it.year)}</span>` : ""}
            <span class="badge blue">${escapeHtml(it.source)}</span>
          </div>
          <div class="itemActions">
            <button type="button" class="primary" data-open-rel="1">Open</button>
          </div>
        </div>`;
    }
    html += `</div>`;
    setPanel(html);

    Array.from(qs("panel").querySelectorAll('[data-open-rel="1"]')).forEach((b, idx) => {
      b.onclick = () => {
        sessionStorage.setItem("last_external", JSON.stringify(items[idx]));
        sessionStorage.removeItem("open_study_id");
        location.href = "paper.html";
      };
    });
  } catch(e) {
    setPanel(`<div class="small" style="color:var(--bad);font-weight:900;">${escapeHtml(e.message)}</div>`);
    showToast("Related failed", e.message, "error");
  }
}

/* ═══════════════════════════════════════════
   PANEL MODE + CLOSE
═══════════════════════════════════════════ */
function setMode(mode) {
  qs("paperSplit").classList.toggle("drawerMode", mode === "drawer");
  qs("modeBtn").textContent = `Mode: ${mode === "drawer" ? "Drawer" : "Side"}`;
  sessionStorage.setItem("paper_panel_mode", mode);
}

qs("modeBtn").onclick  = () => {
  const cur = sessionStorage.getItem("paper_panel_mode") || "side";
  setMode(cur === "side" ? "drawer" : "side");
};
qs("closeBtn").onclick = () => {
  const closed = qs("paperSplit").classList.toggle("panelClosed");
  qs("closeBtn").textContent = closed ? "Open" : "Close";
};

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
(async function init() {
  const ref = getCurrentPaper();
  setMode(sessionStorage.getItem("paper_panel_mode") || "side");

  let p = null;

  if (ref.mode === "saved") {
    if (requireAuthOrRedirect()) {
      try {
        savedStudy = await fetchJson(`/studies/${ref.id}`);
        p = savedStudy;
        qs("saveBtn").textContent = "Saved";
        qs("saveBtn").disabled    = true;
        external = null;
      } catch(e) {
        sessionStorage.removeItem("open_study_id");
        savedStudy = null;
        const ext = sessionStorage.getItem("last_external");
        if (ext) {
          try { external = JSON.parse(ext); p = external; qs("saveBtn").disabled = !getToken(); }
          catch { sessionStorage.removeItem("last_external"); }
        }
        if (!p) {
          qs("title").textContent    = "NO PAPER SELECTED";
          qs("saveBtn").disabled     = true;
          qs("openBtn").disabled     = true;
          qs("loadFullBtn").disabled = true;
          qs("openFullBtn").disabled = true;
          setFullText(`<div class="small">(not loaded)</div>`);
          await fillSaveFolderPick();
          setPanel(`<div class="small">That saved paper no longer exists. Go back to Search/Library and open again.</div>`);
          return;
        }
      }
    }
  } else if (ref.mode === "external") {
    external = ref.paper;
    p = external;
    qs("saveBtn").disabled = !getToken();
  } else {
    qs("title").textContent    = "NO PAPER SELECTED";
    qs("saveBtn").disabled     = true;
    qs("openBtn").disabled     = true;
    qs("loadFullBtn").disabled = true;
    qs("openFullBtn").disabled = true;
    setFullText(`<div class="small">(not loaded)</div>`);
    await fillSaveFolderPick();
    setPanel(`<div class="small">Select a paper from Search or Library.</div>`);
    return;
  }

  renderPaper(p);
  setFullText(`<div class="small">(not loaded)</div>`);

  const enriched = await ensureAbstractAndPMC(p);

  if (ref.mode === "external") {
    external = enriched;
    sessionStorage.setItem("last_external", JSON.stringify(external));
  } else if (ref.mode === "saved" && savedStudy) {
    savedStudy = { ...savedStudy, ...enriched };
  }

  renderPaper(enriched);
  qs("loadFullBtn").disabled = !canLoadOAFullText(enriched);
  await fillSaveFolderPick();
  showThread(true);
})();

} // end init guard
</script>
