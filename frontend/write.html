<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Writing Suite — Seren</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .split {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }

    .panelBox {
      background: var(--surface2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; margin-bottom: 20px;
    }
  </style>
</head>
<body>

<main class="container" style="max-width:1200px; padding-top:40px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
    <div>
      <h1 style="font-family:var(--font-display);font-size:26px;color:var(--navy);letter-spacing:-0.03em;">Writing Suite</h1>
      <p style="color:var(--muted);font-size:14.5px;max-width:600px;line-height:1.6;">
        Draft IMRaD sections using your synthesised evidence base.
      </p>
    </div>
  </div>

  <div class="split">
    <!-- Tools Panel -->
    <div>
      <div class="panelBox">
        <label style="font-size:12px;font-weight:700;color:var(--subtle);text-transform:uppercase;">Select Synthesis</label>
        <select id="synSelect" style="width:100%;margin-top:8px;margin-bottom:16px;padding:8px;"></select>

        <label style="font-size:12px;font-weight:700;color:var(--subtle);text-transform:uppercase;">Tool</label>
        <select id="toolSelect" style="width:100%;margin-top:8px;margin-bottom:16px;padding:8px;">
          <option value="draft">Draft Custom Section</option>
          <option value="abstract">IMRaD Abstract</option>
          <option value="discussion">Discussion Section</option>
          <option value="limitations">Limitations</option>
          <option value="future">Future Work</option>
          <option value="conference">Conference Abstract</option>
          <option value="cover">Submit Cover Letter</option>
          <option value="bib">Annotated Bibliography (DOCX)</option>
        </select>
        
        <div id="draftInputs">
           <input type="text" id="sectionName" placeholder="Section Name (e.g. Introduction)" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r-sm);" />
           <textarea id="bulletPoints" placeholder="Bullet points..." rows="5" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r-sm);"></textarea>
        </div>
        
        <div id="journalInput" style="display:none;">
           <input type="text" id="jName" placeholder="Journal Name" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r-sm);" />
        </div>

        <button class="btn primary w-full" id="runWritingBtn">Generate</button>
      </div>
    </div>

    <!-- Output Panel -->
    <div class="panelBox" style="min-height:500px;display:flex;flex-direction:column;">
       <div style="font-size:12px;font-weight:700;color:var(--subtle);text-transform:uppercase;margin-bottom:12px;">Draft Output</div>
       <div id="writingOutput" style="flex:1;font-size:13.5px;line-height:1.7;color:var(--text2);white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;overflow-y:auto;">
         Select a tool and hit generate...
       </div>
    </div>

  </div>

</main>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
  let activeSyntheses = [];

  async function init() {
    if(!getToken()) return;
    try {
      const synRes = await fetchJson('/synthesis?limit=10');
      activeSyntheses = synRes.items || synRes;
      const sel = document.getElementById("synSelect");
      if(activeSyntheses.length === 0){
         sel.innerHTML = '<option>No syntheses found...</option>';
      } else {
         sel.innerHTML = activeSyntheses.map(s => `<option value="${s.id}">${s.synthesis_name || 'Synthesis #'+s.id}</option>`).join('');
      }
    } catch(e) {}
  }
  
  document.getElementById("toolSelect").onchange = (e) => {
    const v = e.target.value;
    document.getElementById("draftInputs").style.display = (v==='draft' || v==='discussion') ? "block" : "none";
    document.getElementById("sectionName").style.display = (v==='draft') ? "block" : "none";
    document.getElementById("journalInput").style.display = (v==='cover') ? "block" : "none";
  };
  
  document.getElementById("runWritingBtn").onclick = async (e) => {
    const synId = parseInt(document.getElementById("synSelect").value);
    if(isNaN(synId)) { alert("Need a synthesis first"); return; }
    const tool = document.getElementById("toolSelect").value;
    const out = document.getElementById("writingOutput");
    
    e.target.textContent = "Writing..."; e.target.disabled = true;
    out.textContent = "Drafting academic text. Please wait...";
    
    try {
       // Setup endpoints map
       let textOutput = "";
       if(tool === 'draft') {
         const sec = document.getElementById("sectionName").value;
         const bp = document.getElementById("bulletPoints").value;
         const rr = await fetchJson('/ai/writing/draft-section', { method:'POST', body:{synthesis_id:synId, section_name:sec, bullet_points:bp}});
         textOutput = rr.text;
       } else if (tool === 'discussion') {
         const bp = document.getElementById("bulletPoints").value;
         const rr = await fetchJson('/ai/writing/discussion', { method:'POST', body:{synthesis_id:synId, bullet_points:bp}});
         textOutput = rr.text;
       } else if (tool === 'BIB') {
           // Not a fetchJson text
       } else if (tool === 'bib') {
           // Download DOCX
           const syn = activeSyntheses.find(s=>s.id===synId);
           const sids = syn ? JSON.parse(syn.study_ids) : [];
           window.location.href = apiBase + '/studies/export/xlsx?token=' + getToken(); // Default to xlsx for bib placeholder
           textOutput = "Triggered bibliography download";
       } else if (tool === 'cover') {
         const jn = document.getElementById("jName").value;
         const rr = await fetchJson('/ai/writing/cover-letter', { method:'POST', body:{synthesis_id:synId, journal_name:jn}});
         textOutput = rr.text;
       } else {
         const mp = {
            'abstract': '/ai/writing/abstract',
            'limitations': '/ai/writing/limitations',
            'future': '/ai/writing/future-work',
            'conference': '/ai/writing/conference-abstract'
         };
         
         if(tool === 'limitations') {
             const syn = activeSyntheses.find(s=>s.id===synId);
             const sids = syn ? JSON.parse(syn.study_ids) : [];
             const rr = await fetchJson(mp[tool], { method:'POST', body:{study_ids: sids} });
             textOutput = rr.text;
         } else {
             const rr = await fetchJson(mp[tool], { method:'POST', body:{synthesis_id:synId} });
             textOutput = (tool === 'abstract') ? JSON.stringify(rr, null, 2) : rr.text;
         }
       }
       out.textContent = textOutput;
    } catch(err) {
       out.textContent = "Error: " + err.message;
    }
    
    e.target.textContent = "Generate"; e.target.disabled = false;
  };

  window.onload = () => { requireAuthOrRedirect(); init(); };
</script>
</body>
</html>
