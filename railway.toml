[build]
builder = "nixpacks"

[deploy]
# We use sh -c to ensure the shell handles the command chaining and variables
startCommand = "sh -c 'alembic upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port 8080'"

healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10