[build]
builder = "nixpacks"

[deploy]
# We use 'sh -c' to make sure the environment variables are read correctly
startCommand = "sh -c 'alembic upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port 8080'"

healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10