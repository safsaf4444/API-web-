# .github/workflows/ci.yml
# Runs on every push and pull request.
# Jobs: lint (ruff) → test (pytest 93 tests) → (optional) deploy hint

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ─────────────────────────────────────────
  # 1. LINT
  # ─────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check backend/ tests/ --select E,F --ignore E501,E711,E712
        # E501 = line too long, E711/E712 = SQLModel uses == None / == True

  # ─────────────────────────────────────────
  # 2. TEST
  # ─────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint

    env:
      # Safe dummy values — tests use in-memory SQLite, never hit real services
      SECRET_KEY: "ci-test-secret-key-not-for-prod"
      DATABASE_URL: "sqlite:///./test.db"
      RATE_LIMIT_ENABLED: "false"
      APP_ENV: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 7